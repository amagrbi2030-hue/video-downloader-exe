          <script src="config.js"></script>
          <script>
          'use strict';
          /* ════════════════════════════════════════════════════════════════
             0) أدوات عامة + جسر التطبيق + التخزين
             ════════════════════════════════════════════════════════════════ */
          /* ════════════════════════════════════════════════════════════════
             جسر الويب (Netlify): يحلّ محل جسر تطبيق الأندرويد ويتواصل مع خادم التحميل
             يدعم نوعين: Cobalt API أو خادمك الخاص (app.py)
             ════════════════════════════════════════════════════════════════ */
          if (!window.Android) window.Android = (() => {
            const emit = o => window.onNative && window.onNative(JSON.stringify(o));
            const ls = {get:k=>{try{return localStorage.getItem('vd_'+k)||''}catch(e){return''}}, set:(k,v)=>{try{localStorage.setItem('vd_'+k,v)}catch(e){}}};
            const cfg = () => {
              let s = {}; try { s = JSON.parse(ls.get('server') || '{}'); } catch (e) {}
              const d = window.VD_CONFIG || {};
              const url = ((s.url || d.url || '') + '').trim().replace(/\/+$/, '');
              return {type: s.type || d.type || 'cobalt', url, apiKey: s.apiKey || (s.url ? '' : (d.apiKey || ''))};
            };
            let ver = '', cur = null, ctrl = null;
            const jfetch = (u, o) => fetch(u, o).then(async r => {
              let j = null; try { j = await r.json(); } catch (e) {}
              if (!j) throw Object.assign(new Error('http ' + r.status), {code: r.status === 429 ? 'rate' : 'server'});
              return j;
            });
            const netCode = () => navigator.onLine === false ? 'offline' : 'server';
            const post = (u, b, extra) => jfetch(u, Object.assign({method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b || {})}, extra || {}));
            // اكتشاف تلقائي: إذا كان app.py يعمل على هذا الجهاز يتصل به الموقع دون أي إعداد
            const LOCAL = 'http://127.0.0.1:5000';
            function probeLocal() {
              const ac = new AbortController(); setTimeout(() => ac.abort(), 2500);
              return fetch(LOCAL + '/api/status', {signal: ac.signal}).then(r => r.json())
                .then(j => { if (!j.ok) return false; ls.set('server', JSON.stringify({type:'own', url:LOCAL, apiKey:'', auto:true})); return true; })
                .catch(() => false);
            }
            function status(report) {
              const c = cfg();
              if (!c.url) return probeLocal().then(ok => ok ? status(report) : emit({type:'engine', state:'setup'}));
              emit({type:'engine', state:'preparing'});
              const p = c.type === 'own'
                ? jfetch(c.url + '/api/status').then(s => { if (!s.ok) throw 0; ver = 'yt-dlp ' + (s.version || ''); })
                : jfetch(c.url + '/', {headers:{Accept:'application/json'}}).then(s => { if (!s.cobalt) throw 0; ver = 'cobalt ' + (s.cobalt.version || ''); });
              p.then(() => { emit({type:'engine', state:'ready'}); if (report) UI.toast(t('srvOk'), 'i-check'); })
               .catch(() => { emit({type:'engine', state:'error', code:'server'}); if (report) UI.toast(t('srvFail'), 'i-alert'); });
            }
            setTimeout(() => status(false), 50);
            const cobaltCode = c => { c = String(c || '');
              if (/auth|turnstile|jwt|key/.test(c)) return 'auth';
              if (/rate/.test(c)) return 'rate';
              if (/login|private|age/.test(c)) return 'private';
              if (/link\.|unsupported/.test(c)) return 'unsupported';
              if (/unavailable|not_found|empty|too_long|region|paid|no_media/.test(c)) return 'unavailable';
              if (/fetch|timeout|critical/.test(c)) return 'network';
              return 'unknown'; };
            function poll(c) {
              if (!cur) return; const id = cur;
              jfetch(c.url + '/api/progress/' + id).then(d => {
                if (id !== cur) return;
                if (d.status === 'downloading') emit({type:'progress', phase:'server', percent:d.percent || 0, eta:d.eta || 0, speed:d.speed || '', size:d.size || ''});
                else if (d.status === 'processing') emit({type:'progress', phase:'serverProc', percent:-1});
                else if (d.status === 'done') { cur = null; const u = c.url + '/api/file/' + id;
                  return emit({type:'fileReady', url:u, serverUri:u, filename:d.filename, size:d.filesize, mime:d.mime}); }
                else if (d.status === 'error') { cur = null; return emit({type:'error', code:d.code || 'unknown'}); }
                else if (d.status === 'cancelled') { cur = null; return emit({type:'cancelled'}); }
                setTimeout(() => poll(c), 600);
              }).catch(() => setTimeout(() => poll(c), 1500));
            }
            return {
              web: true, cfg, status,
              kvGet: ls.get, kvSet: ls.set,
              isOnlineNow: () => navigator.onLine !== false,
              getClipboard: () => '',
              version: () => ver,
              haptic: k => { try { navigator.vibrate && navigator.vibrate(k === 'error' ? [20, 40, 20] : 8); } catch (e) {} },
              setSystemBars: hex => { const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = hex; },
              toast: m => UI.toast(m),
              openDownloads: () => {},
              getInfo(url) {
                const c = cfg();
                if (!c.url) return probeLocal().then(ok => { if (ok) { status(false); this.getInfo(url); } else emit({type:'info', ok:false, code:'setup'}); });
