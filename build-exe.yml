# ════════════════════════════════════════════════════════════
#  تحميل الفيديو — ملف واحد يبني برنامج ويندوز (.exe) تلقائياً
#  ضعه في المستودع على المسار:  .github/workflows/build-exe.yml
#  بعد الرفع يُبنى البرنامج خلال ~10 دقائق ويظهر في صفحة Releases
#  ويُعاد بناؤه تلقائياً كل أسبوع بأحدث نسخة من محرك التحميل
# ════════════════════════════════════════════════════════════
name: Build Windows EXE

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate program source
        shell: bash
        run: |
          set -e
          mkdir -p src/static
          cd src
          cat > 'app.py' <<'EOF_0'
          # -*- coding: utf-8 -*-
          """
          تحميل الفيديو — نسخة الموقع (Web)
          خادم Flask يعتمد على yt-dlp + ffmpeg، ويقدّم الواجهة من مجلد static.

          تشغيل محلي:          python app.py            ← يفتح المتصفح على http://127.0.0.1:5000
          على الشبكة المنزلية:  python app.py --lan
          استضافة (Render/VPS): gunicorn -w 1 --threads 8 -b 0.0.0.0:$PORT app:app
          """
          import os
          import re
          import sys
          import time
          import uuid
          import shutil
          import socket
          import threading
          import subprocess
          import webbrowser

          from flask import Flask, request, jsonify, send_file, send_from_directory, abort

          try:
              import yt_dlp
          except ImportError:
              print("❌ مكتبة yt-dlp غير مثبتة. شغّل:  pip install -r requirements.txt")
              sys.exit(1)

          BASE = os.path.dirname(os.path.abspath(__file__))
          STATIC = os.path.join(BASE, "static")
          DL_DIR = os.environ.get("DOWNLOAD_DIR", os.path.join(BASE, "downloads"))
          os.makedirs(DL_DIR, exist_ok=True)

          HAS_FFMPEG = shutil.which("ffmpeg") is not None
          KEEP_HOURS = float(os.environ.get("KEEP_HOURS", "6"))          # مدة الاحتفاظ بالملفات على الخادم
          MAX_JOBS = int(os.environ.get("MAX_JOBS", "3"))                 # أقصى عدد تحميلات متزامنة
          MAX_FILESIZE = os.environ.get("MAX_FILESIZE", "")               # مثال: 2G (فارغ = بلا حد)
          COOKIES_FILE = os.environ.get("COOKIES_FILE", os.path.join(BASE, "cookies.txt"))
          ALLOW_UPDATE = os.environ.get("ALLOW_UPDATE", "1") == "1"

          app = Flask(__name__, static_folder=None)
          JOBS = {}
          SLOTS = threading.Semaphore(MAX_JOBS)

          MIME = {"mp4": "video/mp4", "webm": "video/webm", "mkv": "video/x-matroska", "mp3": "audio/mpeg",
                  "m4a": "audio/mp4", "wav": "audio/wav", "flac": "audio/flac", "opus": "audio/ogg", "ogg": "audio/ogg"}


          class Cancelled(Exception):
              pass


          def base_opts():
              o = {
                  "quiet": True, "no_warnings": True, "noplaylist": True, "windowsfilenames": True,
                  "socket_timeout": 30, "retries": 5, "fragment_retries": 5, "concurrent_fragment_downloads": 4,
              }
              if COOKIES_FILE and os.path.isfile(COOKIES_FILE):
                  o["cookiefile"] = COOKIES_FILE   # اختياري: ملف كوكيز حسابك الشخصي
              return o


          def online():
              try:
                  socket.create_connection(("1.1.1.1", 53), timeout=3).close()
                  return True
              except OSError:
                  return False


          def error_code(e):
              m = str(e).lower()
              if isinstance(e, Cancelled):
                  return "cancelled"
              if "private" in m or "login" in m or "cookies" in m or "sign in" in m:
                  return "private"
              if "unsupported url" in m:
                  return "unsupported"
              if "unavailable" in m or "removed" in m or "not available" in m:
                  return "unavailable"
              if "no space" in m:
                  return "nospace"
              if "unable to download" in m or "timed out" in m or "network" in m or "resolve" in m or "connection" in m:
                  return "network" if online() else "offline"
              return "unknown"


          def human(n, per_sec=False):
              if not n:
                  return ""
              u = ["B", "KB", "MB", "GB"]
              i = 0
              n = float(n)
              while n >= 1024 and i < 3:
                  n /= 1024
                  i += 1
              return f"{n:.1f} {u[i]}" + ("/s" if per_sec else "")


          # ───────────────────────── السماح للموقع المستضاف (Netlify) بالاتصال ─────────────────────────
          ALLOWED_ORIGIN = os.environ.get("ALLOWED_ORIGIN", "*")   # يمكن حصره بعنوان موقعك، مثل https://mysite.netlify.app


          @app.after_request
          def cors(resp):
              resp.headers["Access-Control-Allow-Origin"] = ALLOWED_ORIGIN
              resp.headers["Access-Control-Allow-Methods"] = "GET, POST, DELETE, OPTIONS"
              resp.headers["Access-Control-Allow-Headers"] = "Content-Type"
              resp.headers["Access-Control-Allow-Private-Network"] = "true"   # للاتصال من موقع على الإنترنت بخادم على جهازك
              resp.headers["Access-Control-Expose-Headers"] = "Content-Length, Content-Disposition"
              return resp


          # ───────────────────────── الواجهة والملفات الثابتة ─────────────────────────
          @app.get("/")
          def index():
              return send_from_directory(STATIC, "index.html")


          @app.get("/<path:name>")
          def static_files(name):
              if name.startswith("api/"):
                  abort(404)
              return send_from_directory(STATIC, name)


          # ───────────────────────── واجهة برمجية ─────────────────────────
          @app.get("/api/status")
          def status():
              return jsonify(ok=True, version=yt_dlp.version.__version__, ffmpeg=HAS_FFMPEG)


          @app.post("/api/info")
          def info():
              url = (request.json or {}).get("url", "").strip()
              if not re.match(r"^https?://", url):
                  return jsonify(ok=False, code="unsupported")
              try:
                  with yt_dlp.YoutubeDL(base_opts()) as ydl:
                      j = ydl.extract_info(url, download=False)
                  if j.get("_type") == "playlist" and j.get("entries"):
                      j = next(e for e in j["entries"] if e)
                  fmts = []
                  for f in j.get("formats") or ([j] if j.get("url") else []):
                      v = f.get("vcodec") not in (None, "none")
                      a = f.get("acodec") not in (None, "none")
                      if not v and not a:
                          continue
                      fmts.append({
                          "h": f.get("height") or 0, "ext": f.get("ext") or "", "v": v, "a": a,
                          "size": f.get("filesize") or f.get("filesize_approx") or 0,
                          "fps": f.get("fps") or 0, "tbr": f.get("tbr") or 0, "abr": f.get("abr") or 0,
                      })
                  return jsonify(ok=True, title=j.get("title") or "", thumbnail=j.get("thumbnail") or "",
                                 duration=j.get("duration") or 0, uploader=j.get("uploader") or j.get("channel") or "",
                                 extractor=j.get("extractor_key") or "", formats=fmts)
              except Exception as e:
                  return jsonify(ok=False, code=error_code(e))


          def build_opts(c, out_dir, hook):
              o = base_opts()
              o["outtmpl"] = os.path.join(out_dir, "%(title).80B.%(ext)s")
              o["progress_hooks"] = [hook]
              if MAX_FILESIZE:
                  o["max_filesize"] = yt_dlp.utils.parse_filesize(MAX_FILESIZE)
              if c.get("kind") == "audio":
                  fmt = c.get("afmt", "mp3")
                  if fmt not in ("mp3", "m4a", "opus", "wav", "flac"):
                      fmt = "mp3"
                  if HAS_FFMPEG:
                      o["format"] = "bestaudio/best"
                      pp = {"key": "FFmpegExtractAudio", "preferredcodec": fmt}
                      if fmt in ("mp3", "m4a", "opus"):
                          pp["preferredquality"] = str(c.get("br", "192"))
                      o["postprocessors"] = [pp, {"key": "FFmpegMetadata"}]
                  else:
                      o["format"] = "bestaudio[ext=m4a]/bestaudio/best"
              else:
                  q = str(c.get("quality", "best"))
                  cap = f"[height<={q}]" if q.isdigit() else ""
                  cont = c.get("container", "mp4")
                  if not HAS_FFMPEG:
                      o["format"] = f"best{cap}[acodec!=none][vcodec!=none]/best{cap}/best"
                  elif cont == "webm":
                      o["format"] = f"bestvideo{cap}[ext=webm]+bestaudio[ext=webm]/bestvideo{cap}+bestaudio/best{cap}/best"
                      o["merge_output_format"] = "webm/mkv"
                  elif cont == "mkv":
                      o["format"] = f"bestvideo{cap}+bestaudio/best{cap}/best"
                      o["merge_output_format"] = "mkv"
                  else:
                      o["format"] = f"bestvideo{cap}[ext=mp4]+bestaudio[ext=m4a]/bestvideo{cap}+bestaudio/best{cap}/best"
                      o["merge_output_format"] = "mp4"
              return o


          def run_job(jid, c):
              job = JOBS[jid]
              out_dir = os.path.join(DL_DIR, jid)
              os.makedirs(out_dir, exist_ok=True)

              def hook(d):
                  if job.get("cancel"):
                      raise Cancelled()
                  if d["status"] == "downloading":
                      total = d.get("total_bytes") or d.get("total_bytes_estimate") or 0
                      done = d.get("downloaded_bytes") or 0
                      job.update(status="downloading", percent=round(done * 100 / total, 1) if total else 0,
                                 speed=human(d.get("speed"), True), eta=d.get("eta") or 0, size=human(total))
                  elif d["status"] == "finished":
                      job.update(status="processing", percent=100)

              with SLOTS:
                  if job.get("cancel"):
                      job["status"] = "cancelled"
                      return
                  try:
                      opts = build_opts(c, out_dir, hook)
                      opts["postprocessor_hooks"] = [lambda d: job.update(status="processing")]
                      with yt_dlp.YoutubeDL(opts) as ydl:
                          ydl.download([c["url"]])
                      files = [os.path.join(out_dir, f) for f in os.listdir(out_dir)
                               if not f.endswith((".part", ".ytdl", ".temp"))]
                      if not files:
                          raise RuntimeError("no file")
                      path = max(files, key=os.path.getsize)
                      ext = path.rsplit(".", 1)[-1].lower()
                      job.update(status="done", percent=100, file=path, filename=os.path.basename(path),
                                 filesize=os.path.getsize(path), mime=MIME.get(ext, "application/octet-stream"))
                  except Exception as e:
                      code = error_code(e)
                      job.update(status="cancelled" if code == "cancelled" else "error", code=code)
                      shutil.rmtree(out_dir, ignore_errors=True)


          @app.post("/api/download")
          def download():
              c = request.json or {}
              if not re.match(r"^https?://", c.get("url", "")):
                  return jsonify(ok=False, code="unsupported")
              jid = uuid.uuid4().hex
              JOBS[jid] = {"status": "preparing", "percent": 0, "t": time.time()}
              threading.Thread(target=run_job, args=(jid, c), daemon=True).start()
              return jsonify(ok=True, job_id=jid)


          @app.get("/api/progress/<jid>")
          def progress(jid):
              job = JOBS.get(jid)
              if not job:
                  return jsonify(status="error", code="unknown"), 404
              return jsonify({k: v for k, v in job.items() if k not in ("file", "cancel", "t")})


          @app.post("/api/cancel/<jid>")
          def cancel(jid):
              if jid in JOBS:
                  JOBS[jid]["cancel"] = True
              return jsonify(ok=True)


          @app.route("/api/file/<jid>", methods=["GET", "DELETE"])
          def file(jid):
              job = JOBS.get(jid)
              if not job or job.get("status") != "done" or not os.path.isfile(job.get("file", "")):
                  abort(404)
              if request.method == "DELETE":
                  shutil.rmtree(os.path.join(DL_DIR, jid), ignore_errors=True)
                  JOBS.pop(jid, None)
                  return jsonify(ok=True)
              inline = request.args.get("inline") == "1"
              return send_file(job["file"], mimetype=job.get("mime"), as_attachment=not inline,
                               download_name=job["filename"], conditional=True)


          @app.post("/api/exists")
          def exists():
              out = []
              for u in (request.json or {}).get("uris", []):
                  jid = str(u).rstrip("/").split("/")[-1]
                  j = JOBS.get(jid)
                  out.append(bool(j and j.get("status") == "done" and os.path.isfile(j.get("file", ""))))
              return jsonify(out)


          @app.post("/api/update")
          def update():
              if os.environ.get("VD_FROZEN") == "1":
                  return jsonify(code="exe")   # نسخة البرنامج: التحديث يكون بتحميل أحدث إصدار من البرنامج
              if not ALLOW_UPDATE:
                  return jsonify(code="updatefail")
              try:
                  r = subprocess.run([sys.executable, "-m", "pip", "install", "-U", "yt-dlp"],
                                     capture_output=True, text=True, timeout=180)
                  if r.returncode != 0:
                      return jsonify(code="updatefail")
                  return jsonify(code="restart" if "Successfully installed" in r.stdout else "uptodate")
              except Exception:
                  return jsonify(code="updatefail")


          # ───────────────────────── تنظيف الملفات القديمة ─────────────────────────
          def cleaner():
              while True:
                  time.sleep(1800)
                  limit = time.time() - KEEP_HOURS * 3600
                  for jid, j in list(JOBS.items()):
                      if j.get("t", 0) < limit and j.get("status") in ("done", "error", "cancelled"):
                          shutil.rmtree(os.path.join(DL_DIR, jid), ignore_errors=True)
                          JOBS.pop(jid, None)
                  for d in os.listdir(DL_DIR):
                      p = os.path.join(DL_DIR, d)
                      if d not in JOBS and os.path.isdir(p) and os.path.getmtime(p) < limit:
                          shutil.rmtree(p, ignore_errors=True)


          threading.Thread(target=cleaner, daemon=True).start()


          def local_ip():
              try:
                  s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  s.connect(("8.8.8.8", 80))
                  ip = s.getsockname()[0]
                  s.close()
                  return ip
              except Exception:
                  return "127.0.0.1"


          if __name__ == "__main__":
              lan = "--lan" in sys.argv
              port = int(os.environ.get("PORT", "5000"))
              print("\n🎬  تحميل الفيديو يعمل الآن")
              print(f"   افتح المتصفح على:  http://127.0.0.1:{port}")
              if lan:
                  print(f"   من الجوال (نفس الشبكة):  http://{local_ip()}:{port}")
              print(f"   ffmpeg: {'✅ موجود' if HAS_FFMPEG else '⚠️ غير موجود — ثبّته للحصول على كل الجودات والصيغ'}\n")
              if "--no-browser" not in sys.argv:
                  threading.Timer(1.2, lambda: webbrowser.open(f"http://127.0.0.1:{port}")).start()
              app.run(host="0.0.0.0" if lan else "127.0.0.1", port=port, threaded=True)
          EOF_0
          echo "" | base64 -d > 'icon.ico'
          cat > 'launcher.py' <<'EOF_1'
          # -*- coding: utf-8 -*-
          """
          تحميل الفيديو — برنامج ويندوز
          يشغّل محرك التحميل داخلياً ويفتح الواجهة في المتصفح، بدون أي تثبيت أو إعداد.
          """
          import os
          import sys
          import json
          import socket
          import threading
          import time
          import urllib.request
          import webbrowser

          PORT = 5000                      # نفس المنفذ الذي يكتشفه موقع Netlify تلقائياً
          FROZEN = getattr(sys, "frozen", False)
          BUNDLE = getattr(sys, "_MEIPASS", os.path.dirname(os.path.abspath(__file__)))
          DATA = os.path.join(os.environ.get("LOCALAPPDATA") or os.path.expanduser("~"), "VideoDownloader")
          os.makedirs(DATA, exist_ok=True)

          # ffmpeg المدمج داخل البرنامج + مجلدات البيانات
          os.environ["PATH"] = BUNDLE + os.pathsep + os.environ.get("PATH", "")
          os.environ.setdefault("DOWNLOAD_DIR", os.path.join(DATA, "downloads"))
          os.environ.setdefault("COOKIES_FILE", os.path.join(os.path.dirname(sys.executable if FROZEN else __file__), "cookies.txt"))
          if FROZEN:
              os.environ["VD_FROZEN"] = "1"


          def running_already(port):
              try:
                  with urllib.request.urlopen(f"http://127.0.0.1:{port}/api/status", timeout=1.5) as r:
                      return json.load(r).get("ok") is True
              except Exception:
                  return False


          def port_free(port):
              s = socket.socket()
              try:
                  s.bind(("127.0.0.1", port))
                  return True
              except OSError:
                  return False
              finally:
                  s.close()


          def pick_port():
              if port_free(PORT):
                  return PORT
              s = socket.socket()
              s.bind(("127.0.0.1", 0))
              p = s.getsockname()[1]
              s.close()
              return p


          def serve(app, port):
              try:
                  from waitress import serve as wserve
                  wserve(app, host="127.0.0.1", port=port, threads=8, _quiet=True)
              except ImportError:
                  app.run(host="127.0.0.1", port=port, threaded=True)


          def wait_up(port, timeout=20):
              t = time.time()
              while time.time() - t < timeout:
                  if running_already(port):
                      return True
                  time.sleep(0.25)
              return False


          def selftest():
              """فحص آلي يُستخدم أثناء البناء على GitHub للتأكد أن البرنامج يعمل"""
              out = {}
              try:
                  import shutil
                  import app as server
                  out["ffmpeg"] = shutil.which("ffmpeg") is not None
                  out["ytdlp"] = server.yt_dlp.version.__version__
                  port = pick_port()
                  threading.Thread(target=serve, args=(server.app, port), daemon=True).start()
                  out["server"] = wait_up(port)
                  with urllib.request.urlopen(f"http://127.0.0.1:{port}/", timeout=5) as r:
                      out["ui"] = b"<html" in r.read(400).lower()
                  out["ok"] = all([out["ffmpeg"], out["server"], out["ui"]])
              except Exception as e:
                  out["ok"] = False
                  out["error"] = repr(e)
              with open("selftest.txt", "w", encoding="utf-8") as f:
                  json.dump(out, f)
              os._exit(0 if out.get("ok") else 1)


          def control_window(url):
              """نافذة صغيرة توضّح أن البرنامج يعمل، مع زر لفتح الواجهة وزر للإيقاف"""
              try:
                  import tkinter as tk
              except ImportError:
                  while True:
                      time.sleep(3600)
              root = tk.Tk()
              root.title("تحميل الفيديو")
              root.geometry("380x210")
              root.resizable(False, False)
              root.configure(bg="#12152a")
              try:
                  root.iconbitmap(os.path.join(BUNDLE, "icon.ico"))
              except Exception:
                  pass
              tk.Label(root, text="● البرنامج يعمل الآن", fg="#34d399", bg="#12152a", font=("Segoe UI", 14, "bold")).pack(pady=(22, 4))
              tk.Label(root, text="Video Downloader is running", fg="#9aa0b8", bg="#12152a", font=("Segoe UI", 9)).pack()
              tk.Label(root, text="اترك هذه النافذة مفتوحة أثناء التحميل", fg="#c3c4d4", bg="#12152a", font=("Segoe UI", 10)).pack(pady=(10, 12))
              row = tk.Frame(root, bg="#12152a")
              row.pack()
              tk.Button(row, text="فتح الواجهة  Open", command=lambda: webbrowser.open(url), bg="#7c5cff", fg="white",
                        activebackground="#6a4cf0", relief="flat", padx=14, pady=6, font=("Segoe UI", 10, "bold")).pack(side="left", padx=6)
              tk.Button(row, text="إيقاف  Quit", command=lambda: os._exit(0), bg="#2a2d45", fg="white",
                        activebackground="#3a3d55", relief="flat", padx=14, pady=6, font=("Segoe UI", 10)).pack(side="left", padx=6)
              root.protocol("WM_DELETE_WINDOW", lambda: os._exit(0))
              root.mainloop()
              os._exit(0)


          def main():
              if "--selftest" in sys.argv:
                  selftest()
              # إذا كان البرنامج يعمل بالفعل، نفتح الواجهة فقط
              if running_already(PORT):
                  webbrowser.open(f"http://127.0.0.1:{PORT}")
                  return
              import app as server
              port = pick_port()
              threading.Thread(target=serve, args=(server.app, port), daemon=True).start()
              url = f"http://127.0.0.1:{port}"
              if wait_up(port):
                  webbrowser.open(url)
              control_window(url)


          if __name__ == "__main__":
              main()
          EOF_1
          cat > 'static/config.js' <<'EOF_2'
          // عند فتح الواجهة من الخادم نفسه تتصل به تلقائياً
          window.VD_CONFIG = { type: 'own', url: location.origin, apiKey: '' };
          EOF_2
          echo "" | base64 -d > 'static/icon-192.png'
          echo "" | base64 -d > 'static/icon-512.png'
          cat > 'static/index.html' <<'EOF_3'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
          <title>تحميل الفيديو</title>
          <meta name="theme-color" content="#0a0b14">
          <meta name="description" content="حمّل واحفظ محتواك المفضل من يوتيوب وإنستغرام وX وتيك توك بصيغة فيديو أو صوت">
          <link rel="manifest" href="manifest.webmanifest">
          <link rel="icon" type="image/png" href="icon-192.png">
          <link rel="apple-touch-icon" href="icon-192.png">
          <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
          <style>
          /* ═══════════════ DESIGN TOKENS (تُحدَّث كلها من محرك الثيمات) ═══════════════ */
          :root{
            --bg-primary:#0a0b14; --bg-secondary:#0f1120;
            --surface-primary:#141626; --surface-solid:#161829; --surface-elevated:#1c1f33; --surface-glass:rgba(28,31,51,.55);
            --card-bg:#141626; --input-bg:#0e1020; --btn-bg:#1e2136;
            --grad-primary:linear-gradient(135deg,#7c5cff,#b06ab3); --grad-secondary:linear-gradient(135deg,rgba(124,92,255,.16),rgba(176,106,179,.1));
            --accent:#9473ff; --accent-text:#a98fff; --accent-soft:rgba(124,92,255,.14); --on-accent:#fff;
            --text-primary:#f3f3f8; --text-secondary:#c3c4d4; --text-muted:#8d8fa6; --icon:#c3c4d4;
            --border:rgba(255,255,255,.08); --divider:rgba(255,255,255,.06);
            --success:#34d399; --warning:#fbbf24; --error:#f87171;
            --glow:rgba(124,92,255,.32); --c1:rgba(124,92,255,.5); --c2:rgba(176,106,179,.45); --c3:rgba(80,120,255,.35);
            --ambient:.55; --blur:0px; --shadow:0 12px 32px rgba(0,0,0,.35);
            --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px;
            --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
            --nav-h:66px;
          }
          *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
          html,body{background:var(--bg-primary);color:var(--text-primary)}
          body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;
            -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
          button,input,select,textarea{font:inherit;color:inherit}
          button{cursor:pointer;border:0;background:none}
          svg.i{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
          svg.i.sm{width:18px;height:18px} svg.i.xs{width:15px;height:15px} svg.i.lg{width:28px;height:28px}
          .hidden{display:none!important}
          html.theme-anim *, html.theme-anim *::before{transition:background-color .45s var(--ease),color .45s var(--ease),border-color .45s var(--ease),box-shadow .45s var(--ease)!important}
          html.rm *,html.rm *::before,html.rm *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}

          /* ═══════════════ AMBIENT BACKGROUND ═══════════════ */
          .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--ambient)}
          .ambient b{position:absolute;width:85vmax;height:85vmax;border-radius:50%;will-change:transform}
          .ambient b:nth-child(1){background:radial-gradient(circle,var(--c1),transparent 62%);top:-45vmax;inset-inline-end:-35vmax;animation:drift1 38s ease-in-out infinite alternate}
          .ambient b:nth-child(2){background:radial-gradient(circle,var(--c2),transparent 62%);bottom:-50vmax;inset-inline-start:-40vmax;animation:drift2 44s ease-in-out infinite alternate}
          .ambient b:nth-child(3){background:radial-gradient(circle,var(--c3),transparent 65%);top:30%;inset-inline-start:30%;width:60vmax;height:60vmax;opacity:.5;animation:drift3 52s ease-in-out infinite alternate}
          @keyframes drift1{to{transform:translate(-12vmax,10vmax) scale(1.08)}}
          @keyframes drift2{to{transform:translate(10vmax,-12vmax) scale(1.1)}}
          @keyframes drift3{to{transform:translate(-14vmax,-8vmax) scale(.9)}}
          [data-bggrad="1"] .ambient::after{content:"";position:absolute;inset:0 0 auto;height:340px;background:var(--grad-primary);opacity:.22;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}

          /* ═══════════════ LAYOUT ═══════════════ */
          .app{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px calc(var(--nav-h) + 34px)}
          .page{display:none}
          .page.on{display:block;animation:pageIn .42s var(--ease)}
          @keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
          .section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}
          .section-title h2{font-size:1rem;font-weight:800;letter-spacing:.1px}
          .section-title small{color:var(--text-muted);font-size:.8rem}

          /* Surfaces */
          .card{position:relative;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;
            box-shadow:var(--shadow);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
          [data-card="neu"] .card{border-color:transparent;box-shadow:8px 8px 20px rgba(0,0,0,.42),-6px -6px 16px rgba(255,255,255,.025),inset 0 1px 0 rgba(255,255,255,.04)}
          [data-card="tonal"] .card{border-color:transparent}
          .card + .card{margin-top:14px}

          /* Buttons */
          .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;border-radius:var(--r-md);
            padding:0 20px;height:52px;transition:transform .18s var(--ease),filter .2s,box-shadow .25s,opacity .2s;user-select:none;overflow:hidden}
          .btn:active{transform:scale(.965)}
          .btn.primary{background:var(--grad-primary);color:var(--on-accent);box-shadow:0 10px 26px -8px var(--glow)}
          .btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
          .btn.secondary{background:var(--btn-bg);border:1px solid var(--border);color:var(--text-primary)}
          .btn.ghost{color:var(--accent-text);height:44px}
          .btn.block{width:100%}
          .btn.lg{height:58px;font-size:1.04rem;border-radius:18px}
          .btn:disabled{opacity:.5;pointer-events:none}
          .icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-glass);border:1px solid var(--border);
            color:var(--icon);transition:transform .18s var(--ease),background .2s;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
          .icon-btn:active{transform:scale(.92)}
          .icon-btn.plain{background:transparent;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}

          /* ═══════════════ HEADER ═══════════════ */
          .hero{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:'logo text actions';align-items:center;column-gap:16px;padding:6px 2px 4px}
          .logo-wrap{grid-area:logo}.hero-text{grid-area:text}.hero-actions{grid-area:actions}
          .logo-wrap{position:relative;width:84px;height:84px;flex-shrink:0}
          .logo-wrap::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:var(--grad-primary);filter:blur(26px);opacity:.55;animation:breathe 6s ease-in-out infinite}
          .logo-tile{position:relative;width:84px;height:84px;border-radius:26px;display:grid;place-items:center;
            background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03)),var(--surface-elevated);border:1px solid var(--border);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 14px 30px -10px rgba(0,0,0,.5)}
          .logo-tile img{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
          @keyframes breathe{50%{opacity:.32;transform:scale(.92)}}
          .hero-text{flex:1;min-width:0}
          .hero-text h1{font-size:1.55rem;font-weight:800;line-height:1.2;letter-spacing:-.2px}
          .hero-text p{color:var(--text-muted);font-size:.88rem;margin-top:4px}
          .hero-actions{display:flex;gap:8px}
          @media(max-width:440px){.hero{grid-template-columns:auto 1fr;grid-template-areas:'logo text' 'logo actions';row-gap:10px}.hero-actions .icon-btn{width:40px;height:40px;border-radius:13px}}
          .page-head{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
          .page-head h1{font-size:1.4rem;font-weight:800;flex:1}
          .page-head p{color:var(--text-muted);font-size:.85rem}

          /* engine pill */
          .engine{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--text-muted);padding:6px 12px;border-radius:99px;background:var(--surface-glass);border:1px solid var(--border);margin-top:14px}
          .engine i{width:8px;height:8px;border-radius:50%;background:var(--warning);box-shadow:0 0 0 3px color-mix(in srgb,var(--warning) 22%,transparent)}
          .engine.ready i{background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 22%,transparent)}
          .engine.error i{background:var(--error)}
          .engine.busy i{animation:blink 1s infinite}
          @keyframes blink{50%{opacity:.3}}

          /* ═══════════════ PLATFORMS ═══════════════ */
          .platforms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
          .pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:var(--r-md);
            background:var(--card-bg);border:1.5px solid var(--border);transition:transform .22s var(--ease),border-color .25s,background .25s;
            -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
          .pcard:active{transform:scale(.95)}
          .pcard .pic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--btn-bg);color:var(--text-secondary);transition:.3s var(--ease)}
          .pcard .pic svg{width:24px;height:24px}
          .pcard span{font-size:.8rem;font-weight:700;color:var(--text-secondary)}
          .pcard .tick{position:absolute;top:7px;inset-inline-end:7px;width:20px;height:20px;border-radius:50%;background:var(--grad-primary);color:var(--on-accent);
            display:grid;place-items:center;transform:scale(0);transition:transform .3s var(--spring)}
          .pcard .tick svg{width:12px;height:12px;stroke-width:3.2}
          .pcard.on{border-color:transparent;background:linear-gradient(var(--surface-solid),var(--surface-solid)) padding-box,var(--grad-primary) border-box;
            box-shadow:0 10px 24px -12px var(--glow)}
          .pcard.on .tick{transform:scale(1)}
          .pcard.on span{color:var(--text-primary)}
          .pcard.on .pic{color:#fff;background:var(--brand);box-shadow:0 8px 18px -8px var(--brand)}

          /* ═══════════════ URL INPUT ═══════════════ */
          .url-card{padding:16px}
          .field{position:relative;display:flex;align-items:center;gap:6px;min-height:62px;padding:0 8px 0 8px;border-radius:18px;background:var(--input-bg);
            border:1.5px solid var(--border);transition:border-color .25s,box-shadow .3s}
          .field.focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 10px 30px -12px var(--glow)}
          .field.invalid{border-color:var(--error);box-shadow:0 0 0 4px color-mix(in srgb,var(--error) 16%,transparent)}
          .field .lead{width:38px;height:38px;display:grid;place-items:center;color:var(--text-muted);flex-shrink:0}
          .field.valid .lead{color:var(--accent-text)}
          .field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:1rem;padding:16px 0;direction:ltr;text-align:start}
          html[dir="rtl"] .field input{text-align:right}
          .field input::placeholder{color:var(--text-muted)}
          .paste-btn{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:13px;background:var(--btn-bg);border:1px solid var(--border);
            font-weight:700;font-size:.86rem;color:var(--text-primary);flex-shrink:0;transition:transform .15s}
          .paste-btn:active{transform:scale(.94)}
          .clear-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text-muted);background:var(--btn-bg)}
          .hint{display:flex;align-items:center;gap:7px;min-height:22px;margin:10px 4px 0;font-size:.83rem;color:var(--text-muted);transition:color .2s}
          .hint.ok{color:var(--success)} .hint.bad{color:var(--error)} .hint.warn{color:var(--warning)}
          .suggest{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--grad-secondary);border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);animation:slideIn .35s var(--ease)}
          .suggest div{flex:1;min-width:0;font-size:.82rem}
          .suggest b{display:block;font-size:.78rem;color:var(--text-muted);font-weight:500}
          .suggest code{display:block;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit;color:var(--text-primary)}
          @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}}
          .consent{margin-top:12px;padding:14px;border-radius:16px;background:var(--surface-glass);border:1px solid var(--border);font-size:.85rem;color:var(--text-secondary)}
          .consent .row{display:flex;gap:8px;margin-top:10px}
          .consent .btn{height:38px;font-size:.84rem;padding:0 14px;border-radius:11px}

          /* Analyze button states */
          .analyze{margin-top:14px}
          .analyze .lbl{display:flex;align-items:center;gap:10px;transition:transform .3s var(--ease),opacity .2s}
          .analyze .bar{position:absolute;inset:auto 0 0 0;height:3px;background:rgba(255,255,255,.18);opacity:0;transition:opacity .2s}
          .analyze .bar::before{content:"";position:absolute;inset:0;width:40%;background:rgba(255,255,255,.85);border-radius:3px;animation:indet 1.1s ease-in-out infinite}
          @keyframes indet{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
          html[dir="rtl"] .analyze .bar::before{animation-name:indetR}
          @keyframes indetR{from{transform:translateX(110%)}to{transform:translateX(-260%)}}
          .analyze[data-state="analyzing"]{pointer-events:none}
          .analyze[data-state="analyzing"] .bar{opacity:1}
          .analyze[data-state="success"]{background:linear-gradient(135deg,var(--success),color-mix(in srgb,var(--success) 70%,#000))!important;color:#06261a}
          .analyze[data-state="error"]{background:linear-gradient(135deg,var(--error),color-mix(in srgb,var(--error) 70%,#000))!important;color:#fff;animation:shake .4s}
          @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
          .spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:spin .7s linear infinite;opacity:.9}
          @keyframes spin{to{transform:rotate(360deg)}}
          .status-line{text-align:center;font-size:.8rem;color:var(--text-muted);margin-top:10px;min-height:20px}

          /* ═══════════════ PREVIEW CARD ═══════════════ */
          .preview{padding:0;overflow:hidden;animation:rise .5s var(--ease)}
          @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
          .thumb{position:relative;aspect-ratio:16/9;background:var(--surface-elevated);overflow:hidden}
          .thumb img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block;transition:transform 6s ease}
          .preview:hover .thumb img{transform:scale(1.04)}
          .thumb::after{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 55%,rgba(0,0,0,.65))}
          .thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-muted);background:var(--grad-secondary)}
          .badge{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:.76rem;font-weight:700;
            background:rgba(10,10,18,.62);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
          .badge.tl{top:12px;inset-inline-start:12px} .badge.br{bottom:12px;inset-inline-end:12px}
          .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--brand,#fff)}
          .pv-body{padding:18px}
          .pv-title{font-size:1.06rem;font-weight:800;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
          .pv-meta{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--text-secondary);font-size:.85rem}
          .avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--grad-primary);color:var(--on-accent);flex-shrink:0}
          .pv-meta .sep{width:4px;height:4px;border-radius:50%;background:var(--text-muted)}
          .label{font-size:.8rem;font-weight:700;color:var(--text-muted);margin:20px 2px 10px;display:flex;justify-content:space-between}
          .seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:5px;border-radius:16px;background:var(--input-bg);border:1px solid var(--border)}
          .seg .ind{position:absolute;left:0;top:5px;bottom:5px;border-radius:12px;background:var(--grad-primary);box-shadow:0 6px 16px -6px var(--glow);transition:transform .35s var(--spring),width .3s}
          .seg button{position:relative;z-index:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.92rem;color:var(--text-secondary);transition:color .25s}
          .seg button.on{color:var(--on-accent)}
          .chips{display:flex;flex-wrap:wrap;gap:8px}
          .chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border-radius:12px;background:var(--btn-bg);border:1.5px solid var(--border);
            font-weight:700;font-size:.86rem;color:var(--text-secondary);transition:all .22s var(--ease)}
          .chip small{font-weight:500;color:var(--text-muted);font-size:.74rem}
          .chip:active{transform:scale(.95)}
          .chip.on{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
          .chip.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-text)}
          .qlist{display:flex;flex-direction:column;gap:8px}
          .qrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--btn-bg);border:1.5px solid var(--border);text-align:start;transition:all .22s var(--ease)}
          .qrow:active{transform:scale(.985)}
          .qrow .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--text-muted);display:grid;place-items:center;flex-shrink:0;transition:.2s}
          .qrow .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--grad-primary);transform:scale(0);transition:transform .25s var(--spring)}
          .qrow.on{border-color:var(--accent);background:var(--accent-soft)}
          .qrow.on .radio{border-color:var(--accent)}
          .qrow.on .radio::after{transform:scale(1)}
          .qrow .q{font-weight:800;font-size:.95rem}
          .qrow .tag{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--grad-secondary);color:var(--accent-text);border:1px solid var(--border)}
          .qrow .sz{margin-inline-start:auto;color:var(--text-muted);font-size:.83rem;direction:ltr}
          .est{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--grad-secondary);border:1px solid var(--border);font-size:.86rem}
          .est b{font-size:1rem;direction:ltr}

          /* ═══════════════ PROGRESS / SUCCESS / ERROR ═══════════════ */
          .prog-card{text-align:center;padding:26px 18px;animation:rise .4s var(--ease)}
          .ring{position:relative;width:150px;height:150px;margin:0 auto}
          .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
          .ring circle{fill:none;stroke-width:10}
          .ring .track{stroke:var(--btn-bg)}
          .ring .val{stroke:url(#ringGrad);stroke-linecap:round;stroke-dasharray:408.4;stroke-dashoffset:408.4;transition:stroke-dashoffset .5s var(--ease);filter:drop-shadow(0 0 8px var(--glow))}
          .ring.indet svg{animation:spin 1.3s linear infinite}
          .ring.indet .val{stroke-dashoffset:300}
          .ring .pct{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:52px;font-size:2rem;font-weight:800;direction:ltr}
          .ring .pct small{font-size:.9rem;color:var(--text-muted);margin-inline-start:2px}
          .phase{font-weight:800;margin-top:18px;font-size:1.02rem}
          .phase-sub{color:var(--text-muted);font-size:.83rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
          .stat{padding:12px 6px;border-radius:14px;background:var(--btn-bg);border:1px solid var(--border)}
          .stat b{display:block;font-size:.95rem;direction:ltr}
          .stat span{font-size:.74rem;color:var(--text-muted)}
          .cancel-btn{margin-top:16px;color:var(--error);height:46px;background:color-mix(in srgb,var(--error) 10%,transparent);border:1px solid color-mix(in srgb,var(--error) 30%,transparent)}

          .success{text-align:center;padding:28px 18px 18px;animation:rise .45s var(--ease)}
          .check-anim{position:relative;width:104px;height:104px;margin:0 auto 6px}
          .check-anim svg{width:100%;height:100%}
          .check-anim .c{fill:none;stroke:url(#ringGrad);stroke-width:5;stroke-dasharray:290;stroke-dashoffset:290;animation:draw .7s var(--ease) forwards}
          .check-anim .k{fill:none;stroke:var(--text-primary);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .45s .55s var(--ease) forwards}
          .check-anim .disc{fill:var(--accent-soft)}
          .check-anim::before,.check-anim::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:burst 1.2s .5s var(--ease)}
          .check-anim::after{animation-delay:.75s}
          @keyframes draw{to{stroke-dashoffset:0}}
          @keyframes burst{0%{opacity:.6;transform:scale(.8)}100%{opacity:0;transform:scale(1.7)}}
          .success h3{font-size:1.25rem;font-weight:800;margin-top:10px}
          .file-info{margin:18px 0 4px;padding:4px 14px;border-radius:16px;background:var(--input-bg);border:1px solid var(--border);text-align:start}
          .file-info .r{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--divider);font-size:.86rem}
          .file-info .r:last-child{border:0}
          .file-info .r span{color:var(--text-muted);min-width:64px}
          .file-info .r b{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
          .err-card{text-align:center;padding:28px 18px 18px;animation:rise .4s var(--ease)}
          .err-ic{width:72px;height:72px;border-radius:24px;margin:0 auto 14px;display:grid;place-items:center;color:var(--error);
            background:color-mix(in srgb,var(--error) 12%,transparent);border:1px solid color-mix(in srgb,var(--error) 28%,transparent)}
          .err-card h3{font-weight:800;font-size:1.1rem}
          .err-card p{color:var(--text-secondary);font-size:.9rem;margin-top:6px}

          /* ═══════════════ DOWNLOADS MANAGER ═══════════════ */
          .toolbar{display:flex;gap:8px;align-items:center}
          .search{flex:1;display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:15px;background:var(--input-bg);border:1.5px solid var(--border);color:var(--text-muted);transition:border-color .2s}
          .search:focus-within{border-color:var(--accent)}
          .search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text-primary)}
          .filters{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 4px;padding:0 18px 4px;scrollbar-width:none}
          .filters::-webkit-scrollbar{display:none}
          .filters .chip{flex-shrink:0;height:36px;padding:0 14px;font-size:.83rem}
          .count{font-size:.8rem;color:var(--text-muted);margin:10px 2px}
          .dl-list{display:flex;flex-direction:column;gap:10px}
          .dl-list.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
          .item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--card-bg);border:1px solid var(--border);
            -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));animation:rise .35s var(--ease) both}
          .item .th{position:relative;width:86px;aspect-ratio:16/10;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--grad-secondary);display:grid;place-items:center;color:var(--accent-text)}
          .item .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
          .item .th .kind{position:absolute;bottom:5px;inset-inline-end:5px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff}
          .item .th .kind svg{width:13px;height:13px}
          .item .info{flex:1;min-width:0}
          .item .nm{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .item .mt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:.75rem;color:var(--text-muted)}
          .item .mt .ext{padding:1px 7px;border-radius:6px;background:var(--btn-bg);border:1px solid var(--border);color:var(--text-secondary);font-weight:700}
          .item .mt .miss{color:var(--error);font-weight:700}
          .item .fav{color:#f5b84b}
          .item .acts{display:flex;gap:4px}
          .item .acts button{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--icon)}
          .item .acts button:active{background:var(--btn-bg)}
          .item .acts .play{background:var(--grad-primary);color:var(--on-accent)}
          .grid .item{flex-direction:column;align-items:stretch;padding:8px}
          .grid .item .th{width:100%}
          .grid .item .info{padding:2px 4px}
          .grid .item .acts{justify-content:space-between}
          .item.missing{opacity:.6}
          .empty{text-align:center;padding:44px 20px 30px}
          .empty svg.art{width:150px;height:120px;margin-bottom:12px}
          .empty h3{font-weight:800}
          .empty p{color:var(--text-muted);font-size:.88rem;margin:6px auto 18px;max-width:280px}

          /* ═══════════════ THEME STUDIO ═══════════════ */
          .mock{position:relative;border-radius:26px;padding:14px;overflow:hidden;background:var(--bg-primary);border:1px solid var(--border);box-shadow:var(--shadow)}
          .mock .amb{position:absolute;inset:0;opacity:var(--ambient);background:radial-gradient(circle at 90% 0%,var(--c1),transparent 55%),radial-gradient(circle at 0% 100%,var(--c2),transparent 55%)}
          .mock > *{position:relative}
          .mk-head{display:flex;align-items:center;gap:10px}
          .mk-logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-elevated);border:1px solid var(--border);box-shadow:0 0 18px -2px var(--glow)}
          .mk-logo img{width:24px}
          .mk-head b{font-size:.9rem;flex:1} .mk-head i{width:28px;height:28px;border-radius:9px;background:var(--surface-glass);border:1px solid var(--border);display:grid;place-items:center;color:var(--icon)}
          .mk-plats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
          .mk-plats div{height:38px;border-radius:11px;background:var(--card-bg);border:1.5px solid var(--border);display:grid;place-items:center;font-size:.68rem;font-weight:700;color:var(--text-secondary)}
          .mk-plats div.on{border-color:transparent;background:linear-gradient(var(--surface-solid),var(--surface-solid)) padding-box,var(--grad-primary) border-box;color:var(--text-primary)}
          .mk-input{margin-top:10px;height:40px;border-radius:12px;background:var(--input-bg);border:1.5px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft);display:flex;align-items:center;padding:0 10px;font-size:.72rem;color:var(--text-muted);direction:ltr}
          .mk-btn{margin-top:8px;height:40px;border-radius:12px;background:var(--grad-primary);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:.8rem;box-shadow:0 8px 18px -8px var(--glow)}
          .mk-card{margin-top:10px;display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--card-bg);border:1px solid var(--border)}
          .mk-card .t{width:58px;height:36px;border-radius:9px;background:var(--grad-secondary)}
          .mk-card .l{flex:1}.mk-card .l i{display:block;height:7px;border-radius:4px;background:var(--text-secondary);opacity:.6;width:85%}.mk-card .l i+i{margin-top:6px;width:45%;background:var(--text-muted)}
          .mk-card .s{height:28px;padding:0 10px;border-radius:9px;background:var(--btn-bg);border:1px solid var(--border);font-size:.65rem;display:grid;place-items:center;color:var(--accent-text);font-weight:700}
          .mk-nav{margin-top:12px;height:44px;border-radius:14px;background:var(--surface-glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:space-around}
          .mk-nav i{width:16px;height:16px;border-radius:5px;background:var(--text-muted);opacity:.5}
          .mk-nav i.on{width:34px;height:22px;border-radius:8px;background:var(--grad-primary);opacity:1}
          .tabs{display:flex;gap:4px;padding:5px;border-radius:16px;background:var(--input-bg);border:1px solid var(--border);margin:18px 0 6px;overflow-x:auto;scrollbar-width:none}
          .tabs::-webkit-scrollbar{display:none}
          .tabs button{flex:1;min-width:max-content;height:40px;padding:0 12px;border-radius:12px;font-weight:700;font-size:.85rem;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;gap:6px;transition:.25s}
          .tabs button.on{background:var(--surface-elevated);color:var(--text-primary);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
          .cats{display:flex;gap:8px;overflow-x:auto;margin:12px -18px;padding:0 18px 4px;scrollbar-width:none}
          .cats::-webkit-scrollbar{display:none}
          .cats .chip{flex-shrink:0;height:34px;font-size:.8rem;padding:0 13px}
          .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
          @media(max-width:380px){.gal{grid-template-columns:repeat(2,1fr)}}
          .gcard{position:relative;border-radius:16px;padding:6px;background:var(--card-bg);border:1.5px solid var(--border);text-align:start;transition:transform .2s var(--ease),border-color .2s}
          .gcard:active{transform:scale(.95)}
          .gcard .sw{height:70px;border-radius:11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
          .gcard b{display:block;font-size:.76rem;margin:7px 3px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .gcard small{display:block;font-size:.66rem;color:var(--text-muted);margin:0 3px 3px}
          .gcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
          .gcard .ok{position:absolute;top:11px;inset-inline-end:11px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:none;place-items:center}
          .gcard .ok svg{width:13px;height:13px;stroke-width:3}
          .gcard.on .ok{display:grid}
          .big-sw{height:120px;border-radius:20px;border:1px solid var(--border);box-shadow:0 14px 30px -14px var(--glow);position:relative;overflow:hidden}
          .big-sw code{position:absolute;bottom:8px;inset-inline:8px;font-size:.66rem;direction:ltr;text-align:left;background:rgba(0,0,0,.45);color:#fff;padding:5px 8px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .stop{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--btn-bg);border:1px solid var(--border)}
          .stop + .stop{margin-top:8px}
          .stop .swb{width:44px;height:44px;border-radius:12px;flex-shrink:0;border:2px solid rgba(255,255,255,.2);box-shadow:0 4px 12px -4px rgba(0,0,0,.5);background-image:var(--chk)}
          .stop .mid{flex:1;min-width:0}
          .stop .mid code{font-size:.8rem;font-weight:700;direction:ltr;display:block;text-align:start}
          .stop .mid input{width:100%}
          .stop .tools{display:flex;gap:2px}
          .stop .tools button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--icon)}
          .stop .tools button:disabled{opacity:.25}
          input[type=range]{-webkit-appearance:none;appearance:none;height:26px;background:transparent;direction:ltr}
          input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--track,var(--input-bg));border:1px solid var(--border)}
          input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.4)}
          .ctrl{display:flex;align-items:center;gap:12px;margin-top:8px}
          .ctrl input{flex:1}
          .ctrl output{min-width:48px;text-align:center;font-weight:700;font-size:.85rem;direction:ltr;padding:6px;border-radius:10px;background:var(--btn-bg);border:1px solid var(--border)}
          .style-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
          .scard{border-radius:18px;padding:8px;background:var(--card-bg);border:1.5px solid var(--border);text-align:start;transition:transform .2s var(--ease)}
          .scard:active{transform:scale(.96)}
          .scard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
          .scard .demo{height:86px;border-radius:13px;padding:9px;position:relative;overflow:hidden}
          .scard .demo i{display:block;border-radius:7px}
          .scard b{display:block;font-size:.82rem;margin:8px 4px 0}
          .scard small{display:block;font-size:.7rem;color:var(--text-muted);margin:2px 4px 4px;line-height:1.4}
          .mytheme{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card-bg);border:1px solid var(--border)}
          .mytheme + .mytheme{margin-top:8px}
          .mytheme .sw{width:52px;height:52px;border-radius:14px;flex-shrink:0}
          .mytheme .inf{flex:1;min-width:0}
          .mytheme .inf b{display:flex;align-items:center;gap:6px;font-size:.9rem}
          .mytheme .inf small{color:var(--text-muted);font-size:.75rem}
          .pill{font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--grad-primary);color:var(--on-accent)}
          .mytheme.cur{border-color:var(--accent)}
          .row-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
          .row-btns .btn{height:46px;font-size:.86rem}

          /* ═══════════════ SETTINGS ═══════════════ */
          .group{padding:4px 16px}
          .set{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--divider);min-height:62px;width:100%;text-align:start}
          .set:last-child{border:0}
          .set .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--grad-secondary);color:var(--accent-text);flex-shrink:0;border:1px solid var(--border)}
          .set .st{flex:1;min-width:0}
          .set .st b{display:block;font-size:.92rem;font-weight:700}
          .set .st small{display:block;color:var(--text-muted);font-size:.78rem;margin-top:1px}
          .set .val{color:var(--text-muted);font-size:.85rem}
          .switch{width:50px;height:30px;border-radius:99px;background:var(--btn-bg);border:1px solid var(--border);position:relative;flex-shrink:0;transition:background .25s}
          .switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--text-muted);transition:transform .3s var(--spring),background .2s}
          .switch.on{background:var(--grad-primary);border-color:transparent}
          .switch.on::after{background:#fff;transform:translateX(20px)}
          html[dir="rtl"] .switch.on::after{transform:translateX(-20px)}
          .mini-seg{display:flex;padding:3px;border-radius:12px;background:var(--input-bg);border:1px solid var(--border)}
          .mini-seg button{height:32px;padding:0 12px;border-radius:9px;font-size:.8rem;font-weight:700;color:var(--text-secondary)}
          .mini-seg button.on{background:var(--grad-primary);color:var(--on-accent)}
          .foot{text-align:center;color:var(--text-muted);font-size:.76rem;margin-top:22px;line-height:1.8}

          /* ═══════════════ BOTTOM NAV ═══════════════ */
          .nav{position:fixed;z-index:20;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),560px);
            height:var(--nav-h);display:flex;align-items:center;padding:0 6px;border-radius:22px;background:var(--surface-glass);border:1px solid var(--border);
            -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 14px 40px -10px rgba(0,0,0,.55)}
          [data-mode="light"] .nav{box-shadow:0 12px 34px -12px rgba(20,20,60,.25)}
          .nav .ind{position:absolute;left:0;top:9px;height:30px;width:54px;border-radius:11px;background:var(--grad-primary);box-shadow:0 6px 16px -6px var(--glow);transition:transform .42s var(--spring);will-change:transform}
          .nav button{position:relative;z-index:1;flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--text-muted);font-size:.68rem;font-weight:700;transition:color .25s}
          .nav button svg{width:21px;height:21px;transition:transform .3s var(--spring)}
          .nav button.on{color:var(--text-primary)}
          .nav button.on svg{color:var(--on-accent);transform:translateY(-1px)}

          /* ═══════════════ SHEET / TOAST ═══════════════ */
          .scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
          .scrim.on{opacity:1;pointer-events:auto}
          .sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(100%,620px);max-height:88vh;overflow-y:auto;transform:translate(-50%,105%);
            background:var(--surface-solid);border:1px solid var(--border);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));
            transition:transform .42s var(--ease),visibility 0s .42s;visibility:hidden;box-shadow:0 -20px 50px rgba(0,0,0,.4)}
          .sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .42s var(--ease)}
          .sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--border);margin:2px auto 14px;background:var(--text-muted);opacity:.4}
          .sheet h3{font-size:1.08rem;font-weight:800;margin-bottom:14px}
          .opt-list button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;border-bottom:1px solid var(--divider);font-weight:700;font-size:.93rem;text-align:start}
          .opt-list button:last-child{border:0}
          .opt-list button svg{color:var(--icon)}
          .opt-list button.danger,.opt-list button.danger svg{color:var(--error)}
          .opt-list button .ck{margin-inline-start:auto;color:var(--accent-text)}
          .tinput{width:100%;height:52px;padding:0 16px;border-radius:15px;background:var(--input-bg);border:1.5px solid var(--border);outline:0;color:var(--text-primary)}
          .tinput:focus{border-color:var(--accent)}
          textarea.tinput{height:160px;padding:14px;resize:none;direction:ltr;font-size:.8rem}
          .toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--nav-h) + 28px);transform:translate(-50%,20px);opacity:0;pointer-events:none;
            display:flex;align-items:center;gap:10px;max-width:calc(100% - 40px);padding:12px 16px;border-radius:16px;background:var(--surface-elevated);border:1px solid var(--border);
            box-shadow:0 14px 34px -8px rgba(0,0,0,.5);font-size:.88rem;font-weight:500;transition:all .35s var(--spring)}
          .toast.on{opacity:1;transform:translate(-50%,0)}
          .toast svg{color:var(--accent-text)}

          /* Color picker */
          .cp{direction:ltr}
          .cp-sv{position:relative;height:190px;border-radius:16px;touch-action:none;cursor:crosshair;overflow:hidden}
          .cp-sv::before,.cp-sv::after{content:"";position:absolute;inset:0}
          .cp-sv::before{background:linear-gradient(to right,#fff,rgba(255,255,255,0))}
          .cp-sv::after{background:linear-gradient(to top,#000,rgba(0,0,0,0))}
          .cp-dot{position:absolute;z-index:2;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.4);pointer-events:none}
          .cp .hue{--track:linear-gradient(90deg,red,#ff0,lime,cyan,blue,#f0f,red);width:100%;margin-top:14px}
          .cp .alpha{width:100%;margin-top:6px}
          .cp-row{display:flex;gap:10px;align-items:center;margin-top:12px}
          .cp-prev{width:56px;height:56px;border-radius:16px;flex-shrink:0;background-image:var(--chk);position:relative;overflow:hidden;border:1px solid var(--border)}
          .cp-prev i{position:absolute;inset:0}
          .cp-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
          .cp-fields label{display:flex;flex-direction:column;align-items:center;font-size:.66rem;color:var(--text-muted);gap:3px}
          .cp-fields input{width:100%;height:38px;text-align:center;border-radius:10px;background:var(--input-bg);border:1px solid var(--border);outline:0;font-size:.82rem;font-weight:700}
          .cp-fields .wide{grid-column:span 4}
          :root{--chk:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/12px 12px}
          </style>
          </head>
