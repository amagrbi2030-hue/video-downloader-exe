            legal:'Only download content you own or have permission to download, and respect each platform’s terms and creators’ rights.',choose:'Choose',sec:'s',min:'m'}
          };
          let LANG = 'ar';
          const t = (k, vars) => { let s = (T[LANG][k] ?? T.ar[k] ?? k); if (vars) for (const v in vars) s = s.replace('{' + v + '}', vars[v]); return s; };
          function applyI18n() {
            document.documentElement.lang = LANG;
            document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
            $$('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
            $$('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
            $$('[data-i18n-aria]').forEach(e => e.setAttribute('aria-label', t(e.dataset.i18nAria)));
          }

          /* ════════════════════════════════════════════════════════════════
             2) محرك الألوان + نظام Design Tokens
             ════════════════════════════════════════════════════════════════ */
          const C = {
            hexToRgb(h){h=(h||'#000').replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h.slice(0,6),16)||0;return{r:n>>16&255,g:n>>8&255,b:n&255}},
            rgbToHex({r,g,b}){return'#'+[r,g,b].map(x=>clamp(Math.round(x),0,255).toString(16).padStart(2,'0')).join('')},
            rgbToHsl({r,g,b}){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
              if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return{h,s:s*100,l:l*100}},
            hslToRgb({h,s,l}){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return{r:f(0)*255,g:f(8)*255,b:f(4)*255}},
            rgbToHsv({r,g,b}){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
              if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return{h,s:mx?d/mx*100:0,v:mx*100}},
            hsvToRgb({h,s,v}){s/=100;v/=100;const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return{r:f(5)*255,g:f(3)*255,b:f(1)*255}},
            lum({r,g,b}){const f=c=>{c/=255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4};return .2126*f(r)+.7152*f(g)+.0722*f(b)},
            contrast(a,b){const l1=C.lum(a),l2=C.lum(b);return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)},
            rgba(c,a){const{r,g,b}=typeof c==='string'?C.hexToRgb(c):c;return`rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${+a.toFixed(3)})`},
            hsl(h,s,l,a=1){return`hsla(${h.toFixed(1)},${clamp(s,0,100).toFixed(1)}%,${clamp(l,0,100).toFixed(1)}%,${a})`},
            hslRgb(h,s,l){return C.hslToRgb({h,s:clamp(s,0,100),l:clamp(l,0,100)})},
            // يرفع/يخفض إضاءة اللون حتى يحقق التباين المطلوب مع الخلفية
            ensure(rgb,bg,ratio){const x=C.rgbToHsl(rgb);const dir=C.lum(bg)<.4?1:-1;let l=x.l;
              for(let i=0;i<60&&C.contrast(C.hslRgb(x.h,x.s,l),bg)<ratio;i++)l+=dir*1.5;return C.rgbToHex(C.hslRgb(x.h,x.s,clamp(l,0,100)))}
          };

          function gradCss(g){
            const st=g.stops.map(s=>`${C.rgba(s.c,s.a??1)} ${Math.round(s.p)}%`).join(', ');
            if(g.type==='radial')return`radial-gradient(circle at ${g.pos||'50% 50%'}, ${st})`;
            if(g.type==='conic')return`conic-gradient(from ${g.angle||0}deg at ${g.pos||'50% 50%'}, ${st})`;
            return`linear-gradient(${g.angle??135}deg, ${st})`;
          }
          const mkGrad=(cols,angle=135)=>({type:'linear',angle,pos:'50% 50%',stops:cols.map((c,i)=>({c,a:1,p:Math.round(i*100/(cols.length-1))}))});

          /* الأنماط البصرية: تحدد شكل الأسطح والحدود والإضاءة، والتدرج يحدد الألوان */
          const STYLES = {
            darkLuxury:   {mode:'dark', tint:.32, baseL:5.5, surfA:1,   blur:0,  borderA:.075, radius:22, glow:.42, ambient:.5,  card:'solid'},
            softGlass:    {mode:'dark', tint:.5,  baseL:6,   surfA:.5,  blur:18, borderA:.12,  radius:24, glow:.38, ambient:.75, card:'glass'},
            neonGlow:     {mode:'dark', tint:.2,  baseL:3.5, surfA:.82, blur:6,  borderA:.0,   radius:18, glow:.85, ambient:.45, card:'neon'},
            minimalClean: {mode:'light',tint:.1,  baseL:97.5,surfA:1,   blur:0,  borderA:.07,  radius:18, glow:.18, ambient:.0,  card:'solid'},
            auroraStyle:  {mode:'dark', tint:.55, baseL:5,   surfA:.55, blur:16, borderA:.1,   radius:24, glow:.5,  ambient:1,   card:'glass'},
            royalGradient:{mode:'dark', tint:.45, baseL:6,   surfA:.72, blur:10, borderA:.09,  radius:22, glow:.5,  ambient:.6,  card:'glass', bgGrad:1},
            frostedGlass: {mode:'light',tint:.35, baseL:95,  surfA:.58, blur:22, borderA:.5,   radius:24, glow:.25, ambient:.55, card:'frost'},
            elegantMono:  {mode:'dark', tint:0,   baseL:6.5, surfA:1,   blur:0,  borderA:.08,  radius:20, glow:.15, ambient:.0,  card:'solid'},
            modernMaterial:{mode:'dark',tint:.38, baseL:7,   surfA:1,   blur:0,  borderA:0,    radius:16, glow:.2,  ambient:.2,  card:'tonal'}
          };

          function computeTokens(th){
            const st=STYLES[th.style]||STYLES.darkLuxury, dark=st.mode==='dark';
            const cols=th.grad.stops.map(s=>C.hexToRgb(s.c));
            const avg={r:cols.reduce((a,c)=>a+c.r,0)/cols.length,g:cols.reduce((a,c)=>a+c.g,0)/cols.length,b:cols.reduce((a,c)=>a+c.b,0)/cols.length};
            const mid=cols[Math.floor((cols.length-1)/2)];
            const accHsl=C.rgbToHsl(mid), h=accHsl.h, sat=Math.min(C.rgbToHsl(avg).s||accHsl.s,85);
            const sb=sat*st.tint*.42, L=st.baseL;
            const tk={};
            if(dark){
              tk['bg-primary']=C.hsl(h,sb,L); tk['bg-secondary']=C.hsl(h,sb,L+3);
              tk['surface-solid']=C.hsl(h,sb*1.1,L+6); tk['surface-primary']=C.hsl(h,sb*1.1,L+6);
              tk['surface-elevated']=C.hsl(h,sb*1.15,L+10.5);
              tk['surface-glass']=C.hsl(h,sb,L+9,.62);
              tk['card-bg']=st.card==='tonal'?C.hsl(h,sb*1.6+4,L+7.5):C.hsl(h,sb*1.1,L+6.5,st.surfA);
              tk['input-bg']=C.hsl(h,sb,L+2.2,st.surfA<1?.7:1);
              tk['btn-bg']=C.hsl(h,sb*1.2+(st.card==='tonal'?6:0),L+11,st.surfA<1?.75:1);
              tk['border']=st.card==='neon'?C.rgba(mid,.28):`rgba(255,255,255,${st.borderA})`;
              tk['divider']='rgba(255,255,255,.06)';
              tk['text-primary']=C.hsl(h,12,96); tk['text-secondary']=C.hsl(h,10,77); tk['text-muted']=C.hsl(h,8,60); tk['icon']=C.hsl(h,10,78);
              tk['success']='#34d399'; tk['warning']='#fbbf24'; tk['error']='#f87171';
              tk['shadow']=st.card==='neon'?`0 0 0 1px ${C.rgba(mid,.06)},0 14px 34px -14px ${C.rgba(mid,.45)}`:st.card==='tonal'?'0 2px 6px rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.22)':'0 12px 32px rgba(0,0,0,.34)';
            }else{
              tk['bg-primary']=C.hsl(h,sb*1.4,L); tk['bg-secondary']=C.hsl(h,sb*1.2,L-3);
              tk['surface-solid']='#ffffff'; tk['surface-primary']='#ffffff'; tk['surface-elevated']='#ffffff';
              tk['surface-glass']='rgba(255,255,255,.72)';
              tk['card-bg']=`rgba(255,255,255,${st.surfA})`;
              tk['input-bg']=st.card==='frost'?'rgba(255,255,255,.6)':C.hsl(h,sb*1.4+6,96);
              tk['btn-bg']=st.card==='frost'?'rgba(255,255,255,.7)':C.hsl(h,sb*1.4+8,93.5);
              tk['border']=st.card==='frost'?'rgba(255,255,255,.75)':`rgba(20,22,45,${st.borderA})`;
              tk['divider']='rgba(20,22,45,.07)';
              tk['text-primary']=C.hsl(h,20,10); tk['text-secondary']=C.hsl(h,10,30); tk['text-muted']=C.hsl(h,8,40); tk['icon']=C.hsl(h,12,32);
              tk['success']='#047857'; tk['warning']='#b45309'; tk['error']='#dc2626';
              tk['shadow']='0 10px 30px -10px rgba(30,30,80,.16)';
            }
            const bgRgb=C.hexToRgb(rgbStrToHex(tk['bg-primary']));
            tk['grad-primary']=gradCss(th.grad);
            tk['grad-secondary']=`linear-gradient(135deg, ${C.rgba(cols[0],dark?.17:.13)}, ${C.rgba(cols[cols.length-1],dark?.09:.08)})`;
            tk['accent']=C.rgbToHex(mid);
            tk['accent-text']=C.ensure(mid,bgRgb,4.6);
            tk['accent-soft']=C.rgba(mid,dark?.15:.12);
            // لون النص فوق التدرج: يُختار الأوضح على أسوأ نقطة في التدرج
            const minC=fg=>Math.min(...cols.map(c=>C.contrast(fg,c)));
            tk['on-accent']=minC({r:255,g:255,b:255})>=minC({r:16,g:16,b:24})*0.8?'#ffffff':'#101018';
            tk['glow']=C.rgba(mid,st.glow*.55);
            tk['c1']=C.rgba(cols[0],dark?.55:.35); tk['c2']=C.rgba(cols[cols.length-1],dark?.5:.3); tk['c3']=C.rgba(mid,dark?.35:.2);
            tk['ambient']=String(st.ambient); tk['blur']=st.blur+'px';
            tk['r-lg']=st.radius+'px'; tk['r-md']=Math.round(st.radius*.72)+'px'; tk['r-sm']=Math.round(st.radius*.55)+'px';
            return {tk,dark,st,bgHex:rgbStrToHex(tk['bg-primary']),c0:C.rgbToHex(cols[0]),cN:C.rgbToHex(cols[cols.length-1])};
          }
          function rgbStrToHex(hsla){ // تحويل hsla(...) إلى hex
            const m=hsla.match(/hsla?\(([\d.]+),([\d.]+)%,([\d.]+)%/); if(!m) return hsla.startsWith('#')?hsla:'#000000';
            return C.rgbToHex(C.hslToRgb({h:+m[1],s:+m[2],l:+m[3]}));
          }

          const FACTORY = {id:'factory',name:'Cosmic Violet',grad:mkGrad(['#7c5cff','#b06ab3','#ff8fb1'],135),style:'darkLuxury'};
          const Theme = {
            cur:null,
            load(){ this.cur=Store.get('theme',null)||structuredCloneSafe(Store.get('themes',[]).find(x=>x.id===Store.get('defaultTheme',''))||FACTORY); },
            apply(th, animate){
              th=th||this.cur; this.cur=th;
              const {tk,dark,st,bgHex,c0,cN}=computeTokens(th), root=document.documentElement;
              if(animate && !Settings.v.reduceMotion){ root.classList.add('theme-anim'); clearTimeout(this._t); this._t=setTimeout(()=>root.classList.remove('theme-anim'),520); }
              for(const k in tk) root.style.setProperty('--'+k,tk[k]);
              root.dataset.mode=dark?'dark':'light'; root.dataset.card=st.card; root.dataset.bggrad=st.bgGrad?'1':'0';
              $('#rg1').setAttribute('stop-color',c0); $('#rg2').setAttribute('stop-color',cN);
              if(A) try{ A.setSystemBars(bgHex,!dark); }catch(e){}
            },
            save(){ Store.set('theme',this.cur); },
            set(th,animate=true){ this.apply(th,animate); this.save(); }
          };
          function structuredCloneSafe(o){ return JSON.parse(JSON.stringify(o)); }

          /* ════════════════════════════════════════════════════════════════
             3) مكتبة التدرجات الجاهزة (48 تدرجاً في 15 فئة)
             ════════════════════════════════════════════════════════════════ */
          const CATS=['Luxury','Royal','Purple','Blue','Ocean','Emerald','Nature','Sunset','Neon','Cyber','Pastel','Rose Gold','Warm','Monochrome','Midnight'];
          const LIB=[
           ['Golden Luxury','Luxury',['#f7d794','#d4a24c','#8a6a33'],135],['Champagne','Luxury',['#f3e7c9','#d4b483','#a88553'],120],['Black Gold','Luxury',['#e6c36a','#b8893a','#5b4423'],150],
           ['Royal Purple','Royal',['#8e2de2','#4a00e0'],135],['Imperial Blue','Royal',['#4e4376','#2b5876','#4ca1af'],135],['Regal Crimson','Royal',['#e0234a','#8a1538','#4a0f3d'],135],
           ['Cosmic Violet','Purple',['#7c5cff','#b06ab3','#ff8fb1'],135],['Lavender Haze','Purple',['#a18cd1','#c79be8','#fbc2eb'],135],['Amethyst','Purple',['#9d50bb','#6e48aa'],135],
           ['Electric Blue','Blue',['#00c6ff','#0072ff'],135],['Sapphire','Blue',['#4facfe','#2a5298','#1e3c72'],135],['Sky Line','Blue',['#56ccf2','#2f80ed'],135],
           ['Ocean Breeze','Ocean',['#43cea2','#2b93c4','#185a9d'],135],['Deep Sea','Ocean',['#00c9ff','#0575e6','#021b79'],160],['Lagoon','Ocean',['#80d0c7','#3a8fa6','#13547a'],135],
           ['Deep Emerald','Emerald',['#38ef7d','#11998e'],135],['Jade','Emerald',['#3cba92','#0ba360'],135],['Emerald City','Emerald',['#56b4d3','#348f50'],135],
           ['Tropical Dream','Nature',['#96c93d','#00b09b','#0f8f9b'],135],['Spring Leaf','Nature',['#d4fc79','#96e6a1','#56ab2f'],135],['Moss','Nature',['#a8c66c','#5a8a5e','#3a6073'],135],
           ['Sunset Glow','Sunset',['#ffb347','#ff6a5b','#d6336c'],135],['Dusk','Sunset',['#feb47b','#ff7e5f','#a84a7a'],135],['Tangerine Sky','Sunset',['#f7b733','#fc4a1a'],135],
           ['Neon Glow','Neon',['#12c2e9','#c471ed','#f64f59'],120],['Neon Pink','Neon',['#ff4ecd','#a020f0','#4b2bd6'],135],['Laser Lime','Neon',['#c6ff00','#00ff95','#00d4ff'],135],
           ['Cyber Neon','Cyber',['#00f5d4','#9b5de5','#f15bb5'],135],['Synthwave','Cyber',['#fc466b','#7a4ff0','#3f5efb'],135],['Matrix','Cyber',['#00ff87','#00c2a8','#60efff'],135],
           ['Cotton Candy','Pastel',['#ffafbd','#ffc3a0'],135],['Mint Cream','Pastel',['#a8edea','#cfe3f0','#fed6e3'],135],['Arctic Frost','Pastel',['#e0f2fe','#a1c4fd','#c2e9fb'],135],
           ['Rose Gold','Rose Gold',['#f6d1c1','#e2a39b','#b76e79'],135],['Blush','Rose Gold',['#ffdde1','#ee9ca7'],135],['Velvet Berry','Rose Gold',['#f15f79','#b24592','#6a2c70'],135],
           ['Desert Sand','Warm',['#f4e2c4','#dfa579','#c07a5f'],135],['Amber','Warm',['#f2c94c','#f2994a','#d9603b'],135],['Ember','Warm',['#ef473a','#cb2d3e','#7a1f2b'],135],
           ['Graphite','Monochrome',['#d7dbe0','#8e98a3','#4b5560'],135],['Silver Mist','Monochrome',['#f5f5f5','#bdbdbd','#8a8a8a'],135],['Onyx','Monochrome',['#8b93a8','#606c88','#3f4c6b'],135],
           ['Midnight Blue','Midnight',['#4364f7','#0052d4','#1a2a6c'],135],['Aurora','Midnight',['#43e97b','#38f9d7','#6a82fb'],120],['Night Orchid','Midnight',['#7b4397','#3c2a7a','#1d2b64'],135],
           ['Cosmic Fusion','Purple',['#ff00cc','#9b51e0','#333399'],135],['Ocean Pearl','Ocean',['#e0eafc','#9fc3e6','#5e8fc2'],135],['Honey Glaze','Warm',['#ffe29f','#ffa99f','#ff719a'],135]
          ].map(([name,cat,cols,ang],i)=>({id:'lib'+i,name,cat,grad:mkGrad(cols,ang)}));

          /* ════════════════════════════════════════════════════════════════
             4) الإعدادات المحفوظة
             ════════════════════════════════════════════════════════════════ */
          const Settings = {
            v:{lang:'ar',reduceMotion:false,haptics:true,clip:null,defKind:'video',defQuality:'best',defContainer:'mp4',defAudio:'mp3',view:'list',sort:'new',saveMode:'ask',folderName:''},
            load(){ Object.assign(this.v, Store.get('settings',{})); if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches && Store.get('settings',{}).reduceMotion===undefined) this.v.reduceMotion=true; },
            save(){ Store.set('settings',this.v); },
            set(k,val){ this.v[k]=val; this.save(); }
          };
          function applyMotion(){ document.documentElement.classList.toggle('rm', !!Settings.v.reduceMotion); }

          /* ════════════════════════════════════════════════════════════════
             5) واجهة عامة: تنقّل، ورقة سفلية، إشعار
             ════════════════════════════════════════════════════════════════ */
          const UI = {
            page:'home',
            go(p){
              if(!$('#pg-'+p)) return;
              this.page=p; $$('.page').forEach(x=>x.classList.toggle('on',x.id==='pg-'+p));
              $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===p));
              this.moveInd(); window.scrollTo({top:0,behavior:'instant'});
              if(p==='downloads'){ Downloads.verify(); Downloads.render(); }
              if(p==='favorites') Downloads.renderFav();
              if(p==='studio') Studio.render();
              if(p==='settings') SettingsPage.render();
              haptic();
            },
            moveInd(){
              const b=$('#nav button.on'), ind=$('#navInd'); if(!b) return;
              const nav=$('#nav').getBoundingClientRect(), r=b.getBoundingClientRect();
              ind.style.transform=`translateX(${r.left-nav.left+(r.width-54)/2}px)`;
            },
            sheetOpen:false,
            sheet(html,onMount){
              $('#sheetBody').innerHTML=html; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); this.sheetOpen=true;
              onMount && onMount($('#sheetBody'));
            },
            closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); this.sheetOpen=false; },
            toast(msg,icon='i-info'){
              const el=$('#toast'); el.querySelector('use').setAttribute('href','#'+icon); el.querySelector('span').textContent=msg;
              el.classList.add('on'); clearTimeout(this._tt); this._tt=setTimeout(()=>el.classList.remove('on'),2600);
            },
            confirm(msg,okLabel,cb){
              this.sheet(`<h3>${esc(msg)}</h3><div class="btn-row"><button class="btn secondary" data-x>${t('back')}</button><button class="btn primary" data-ok style="background:var(--error);color:#fff">${esc(okLabel)}</button></div>`,
                b=>{ $('[data-x]',b).onclick=()=>this.closeSheet(); $('[data-ok]',b).onclick=()=>{ this.closeSheet(); cb(); }; });
            },
            prompt(title,val,cb){
              this.sheet(`<h3>${esc(title)}</h3><input class="tinput" id="pIn" maxlength="40" value="${esc(val)}"><div class="btn-row"><button class="btn secondary" data-x>${t('back')}</button><button class="btn primary" data-ok>${t('done')}</button></div>`,
                b=>{ const i=$('#pIn',b); setTimeout(()=>i.focus(),300); $('[data-x]',b).onclick=()=>this.closeSheet();
                  $('[data-ok]',b).onclick=()=>{ const v=i.value.trim(); if(!v) return; this.closeSheet(); cb(v); }; });
            }
          };
          $('#scrim').onclick=()=>UI.closeSheet();
          document.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g) UI.go(g.dataset.go); });
          window.addEventListener('resize',()=>UI.moveInd());

          /* ════════════════════════════════════════════════════════════════
             6) الرئيسية: المنصات + الرابط الذكي + التحليل
             ════════════════════════════════════════════════════════════════ */
          /* ════════════════════════════════════════════════════════════════
             6-أ) مكان الحفظ على الجهاز (File System Access API) + ذاكرة IndexedDB
             ════════════════════════════════════════════════════════════════ */
          const IDB = {
            db:null, mem:new Map(),
            open(){ return this.db || (this.db = new Promise((res,rej)=>{ const r=indexedDB.open('vd',1); r.onupgradeneeded=()=>r.result.createObjectStore('h'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); },
            async get(k){ if(this.mem.has(k)) return this.mem.get(k); try{ const db=await this.open(); return await new Promise(res=>{ const q=db.transaction('h').objectStore('h').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }); }catch(e){ return undefined; } },
            async set(k,v){ this.mem.set(k,v); try{ const db=await this.open(); return await new Promise(res=>{ const tx=db.transaction('h','readwrite'); tx.objectStore('h').put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){ return false; } },
            async del(k){ this.mem.delete(k); try{ const db=await this.open(); return await new Promise(res=>{ const tx=db.transaction('h','readwrite'); tx.objectStore('h').delete(k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){ return false; } }
          };
          const FS = { canAsk: typeof window.showSaveFilePicker === 'function', canFolder: typeof window.showDirectoryPicker === 'function' };
          const Saver = {
            ctrl:null,
            mode(){ const m=Settings.v.saveMode||'browser'; if(m==='ask'&&!FS.canAsk) return 'browser'; if(m==='folder'&&!FS.canFolder) return 'browser'; return m; },
            async verify(h,mode='readwrite'){ if(!h||!h.queryPermission) return false; if((await h.queryPermission({mode}))==='granted') return true; return (await h.requestPermission({mode}))==='granted'; },
            // تُستدعى لحظة الضغط على زر التحميل لأن المتصفح يشترط لمسة المستخدم لفتح نافذة الحفظ
            async prepare(name,mime){
              const m=this.mode();
              if(m==='ask'){
                const ext=(name.split('.').pop()||'bin').toLowerCase();
                const h=await window.showSaveFilePicker({suggestedName:name,startIn:'downloads',types:[{description:ext.toUpperCase(),accept:{[mime||'application/octet-stream']:['.'+ext]}}]});
                return {mode:'ask',handle:h};
              }
              if(m==='folder'){
                let dir=await IDB.get('dir');
                if(!(dir&&await this.verify(dir))){ dir=await window.showDirectoryPicker({id:'vd',mode:'readwrite',startIn:'downloads'}); await IDB.set('dir',dir); Settings.set('folderName',dir.name); }
                return {mode:'folder',dir};
              }
              return {mode:'browser'};
            },
            async uniqueName(dir,name){
              const dot=name.lastIndexOf('.'), base=dot>0?name.slice(0,dot):name, ext=dot>0?name.slice(dot):'';
              for(let i=0,n=name;;n=`${base} (${++i})${ext}`){ try{ await dir.getFileHandle(n); }catch(e){ return n; } }
            },
            async save(url,name,mime,sink,onProg){
              if(sink.mode==='browser'){ this.anchor(url,name); return {via:'browser',name,size:0}; }
              this.ctrl=new AbortController(); let res;
              try{ res=await fetch(url,{signal:this.ctrl.signal}); if(!res.ok||!res.body) throw new Error('http '+res.status); }
              catch(e){
                if(e.name==='AbortError') throw e;
                // الخادم لا يسمح بالقراءة من الموقع (CORS) ← نكمل بالتحميل العادي عبر المتصفح
                if(sink.mode==='ask'&&sink.handle.remove) sink.handle.remove().catch(()=>{});
                this.anchor(url,name); UI.toast(t('fallbackDl'),'i-info'); return {via:'browser',name,size:0};
              }
              const total=+(res.headers.get('content-length')||res.headers.get('estimated-content-length')||0);
              const handle = sink.mode==='ask' ? sink.handle : await sink.dir.getFileHandle(await this.uniqueName(sink.dir,name),{create:true});
              const w=await handle.createWritable(), rd=res.body.getReader();
              let got=0,lastT=performance.now(),lastB=0,speed=0;
              try{
                for(;;){ const {done,value}=await rd.read(); if(done) break; await w.write(value); got+=value.length;
                  const now=performance.now(); if(now-lastT>400){ speed=(got-lastB)/((now-lastT)/1000); lastT=now; lastB=got; onProg(got,total,speed); } }
                await w.close();
              }catch(e){
                try{ await w.abort(); }catch(_){}
                if(sink.mode==='folder') sink.dir.removeEntry(handle.name).catch(()=>{});
                throw e;
              }
              onProg(got,total||got,0);
              const hid=uid(); await IDB.set('f_'+hid,handle);
              return {via:sink.mode,name:handle.name,size:got,handleId:hid,folder:sink.dir?sink.dir.name:''};
            },
            abort(){ if(this.ctrl) this.ctrl.abort(); },
            anchor(href,name){ const a=document.createElement('a'); a.href=href; a.download=name||''; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); },
            async fileOf(it){ const h=await IDB.get('f_'+it.handleId); if(!h) return null; try{ if(!(await this.verify(h,'read'))) return null; return await h.getFile(); }catch(e){ return null; } }
          };
          /* عمليات الملفات في سجل التحميلات (فتح، مشاركة، حذف، التحقق من الوجود) */
          const Files = {
            async open(it){
              if(!A.web){ A.openFile(it.uri,it.mime); return; }
              if(it.handleId){ const f=await Saver.fileOf(it); if(f){ const u=URL.createObjectURL(f); window.open(u,'_blank'); setTimeout(()=>URL.revokeObjectURL(u),120000); } else UI.toast(t('missingFile'),'i-alert'); return; }
              if(it.uri&&!it.expired){ window.open(it.uri+'?inline=1','_blank','noopener'); return; }
              UI.toast(t('openFromDl'),'i-info');
            },
            async share(it){
              if(!A.web){ A.shareFile(it.uri,it.mime); return; }
              try{
                if(it.handleId){ const f=await Saver.fileOf(it); if(f&&navigator.canShare&&navigator.canShare({files:[f]})) return await navigator.share({files:[f],title:it.title||it.name}); }
                const link=(it.uri&&!it.expired)?it.uri:(it.source||'');
                if(navigator.share&&link) return await navigator.share({url:link,title:it.title||it.name});
                if(navigator.clipboard&&link){ await navigator.clipboard.writeText(link); UI.toast(t('e_linkCopied'),'i-check'); }
              }catch(e){}
            },
            async remove(it){
              if(it.handleId){
                try{
                  const h=await IDB.get('f_'+it.handleId);
                  if(h&&typeof h.remove==='function'){ await Saver.verify(h,'readwrite'); await h.remove(); }
                  else if(it.folder){ const d=await IDB.get('dir'); if(d&&await Saver.verify(d)) await d.removeEntry(it.name); else return false; }
                  else return false;
                  await IDB.del('f_'+it.handleId); return true;
                }catch(e){ return !!(e&&e.name==='NotFoundError'); }
              }
              if(it.uri){ fetch(it.uri,{method:'DELETE'}).catch(()=>{}); return true; }
              return false;
            },
            async verify(items){
              const c=A.cfg(), own=items.filter(x=>x.uri&&!x.handleId);
              if(own.length&&c.type==='own'&&c.url) try{
                const r=await fetch(c.url+'/api/exists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uris:own.map(x=>x.uri)})}).then(r=>r.json());
                r.forEach((ok,i)=>own[i].expired=!ok);
              }catch(e){}
              for(const x of items.filter(x=>x.handleId)){
                try{ const h=await IDB.get('f_'+x.handleId); if(!h){ x.missing=true; continue; }
                  if((await h.queryPermission({mode:'read'}))==='granted') await h.getFile(); x.missing=false;
                }catch(e){ x.missing=!!(e&&e.name==='NotFoundError'); }
              }
            }
          };

          const PLATFORMS=[
            {id:'youtube',name:'YouTube',brand:'#ff0033',rx:/(^|\.|\/\/)(youtube\.com|youtu\.be)(\/|$)/i,ex:'https://youtu.be/…'},
            {id:'instagram',name:'Instagram',brand:'linear-gradient(45deg,#f58529,#dd2a7b,#8134af)',rx:/(^|\.|\/\/)instagram\.com\//i,ex:'https://instagram.com/reel/…'},
            {id:'twitter',name:'X / Twitter',brand:'#16181c',rx:/(^|\.|\/\/)(twitter\.com|x\.com)\//i,ex:'https://x.com/…/status/…'},
            {id:'tiktok',name:'TikTok',brand:'linear-gradient(135deg,#25f4ee,#111 45%,#fe2c55)',rx:/(^|\.|\/\/)tiktok\.com\//i,ex:'https://tiktok.com/@…/video/…'},
            {id:'facebook',name:'Facebook',brand:'#1877f2',rx:/(^|\.|\/\/)(facebook\.com|fb\.watch|fb\.com)\//i,ex:'https://facebook.com/watch/…'},
            {id:'more',name:'',brand:'var(--grad-primary)'}
          ];
          const OTHER_SITES=['Vimeo','Reddit','Twitch','SoundCloud','Dailymotion','Pinterest','Bilibili','Tumblr'];
          const detectPlatform=u=>PLATFORMS.find(p=>p.rx&&p.rx.test(u))||null;
          const isValidUrl=u=>{ try{ const x=new URL(u); return /^https?:$/.test(x.protocol)&&x.hostname.includes('.'); }catch(e){ return false; } };

          const S = {sel:null,url:'',info:null,phase:'idle',kind:'video',quality:'best',container:'mp4',afmt:'mp3',br:'192',lastErr:null,lastDone:null,clipSeen:''};

          const Home = {
            init(){
              $('#platforms').innerHTML=PLATFORMS.map(p=>`<button class="pcard" data-p="${p.id}" style="--brand:${p.brand}" aria-pressed="false">
                <span class="tick">${ic('i-check')}</span><span class="pic"><svg viewBox="0 0 24 24"><use href="#p-${p.id}"/></svg></span><span>${p.id==='more'?t('more'):p.name}</span></button>`).join('');
              $('#platforms').onclick=e=>{ const b=e.target.closest('.pcard'); if(!b) return; haptic();
                if(b.dataset.p==='more') return this.moreSheet();
                this.select(S.sel===b.dataset.p?null:b.dataset.p); this.validate(); };
              const inp=$('#url'), field=$('#field');
              inp.addEventListener('focus',()=>field.classList.add('focus'));
              inp.addEventListener('blur',()=>field.classList.remove('focus'));
              inp.addEventListener('input',()=>this.validate());
              inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ inp.blur(); this.analyze(); } });
              $('#clearBtn').onclick=()=>{ inp.value=''; this.validate(); inp.focus(); this.reset(); };
              $('#pasteBtn').onclick=()=>this.paste();
              $('#analyzeBtn').onclick=()=>this.analyze();
              $('#hdrFolder').onclick=()=>A&&A.openDownloads();
              this.setBtn('ready'); this.validate(); this.consent();
            },
            relabel(){
              $$('#platforms .pcard').forEach(b=>{ if(b.dataset.p==='more') b.lastElementChild.textContent=t('more'); });
              this.setBtn($('#analyzeBtn').dataset.state); this.validate(); this.consent(); Stage.render(); Engine.set(Engine.state,Engine.state==='ready'?'':Engine.code);
            },
            select(id){
              S.sel=id; $$('#platforms .pcard').forEach(b=>{ const on=b.dataset.p===id; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
              const p=PLATFORMS.find(x=>x.id===id); $('#url').placeholder=p?t('ph_p',{p:p.name}):t('ph_any');
            },
            validate(){
              const v=$('#url').value.trim(), field=$('#field'), hint=$('#hint');
              $('#clearBtn').classList.toggle('hidden',!v);
              field.classList.remove('valid','invalid'); hint.className='hint';
              if(!S.sel) $('#url').placeholder=t('ph_any');
              if(!v){ hint.innerHTML=ic('i-info','xs')+`<span>${t('h_empty')}</span>`; return false; }
              if(!isValidUrl(v)){ field.classList.add('invalid'); hint.classList.add('bad'); hint.innerHTML=ic('i-alert','xs')+`<span>${t('h_invalid')}</span>`; return false; }
              field.classList.add('valid');
              const p=detectPlatform(v);
              if(p){
                if(S.sel && S.sel!==p.id && S.sel!=='more'){ const s=PLATFORMS.find(x=>x.id===S.sel); hint.classList.add('warn');
                  hint.innerHTML=ic('i-info','xs')+`<span>${t('h_mismatch',{p:p.name,s:s.name})}</span>`; this.select(p.id); return true; }
                this.select(p.id); hint.classList.add('ok'); hint.innerHTML=ic('i-check','xs')+`<span>${t('h_detected',{p:p.name})}</span>`;
              }else{ this.select(null); hint.classList.add('ok'); hint.innerHTML=ic('i-globe','xs')+`<span>${t('h_other')}</span>`; }
              return true;
            },
            extractUrl(txt){ const m=(txt||'').match(/https?:\/\/[^\s"'<>]+/); return m?m[0]:''; },
            paste(){
              let txt=''; try{ txt=A?A.getClipboard():''; }catch(e){}
              const go=v=>{ const u=this.extractUrl(v)||v.trim(); if(!u){ UI.toast(t('clipEmpty')); return; }
                $('#url').value=u; this.validate(); haptic(); if(isValidUrl(u)) this.analyze(); };
              if(txt) go(txt); else if(navigator.clipboard) navigator.clipboard.readText().then(go).catch(()=>UI.toast(t('clipEmpty'))); else UI.toast(t('clipEmpty'));
            },
            consent(){
              const box=$('#suggestBox');
              if(Settings.v.clip===null && A){
                box.innerHTML=`<div class="consent">${esc(t('consentT'))}<div class="row"><button class="btn primary" data-a="1">${t('allow')}</button><button class="btn secondary" data-a="0">${t('notNow')}</button></div></div>`;
                box.onclick=e=>{ const b=e.target.closest('[data-a]'); if(!b) return; Settings.set('clip',b.dataset.a==='1'); box.innerHTML=''; if(Settings.v.clip) this.checkClip(); };
              } else if(!box.querySelector('.suggest')) box.innerHTML='';
            },
            checkClip(){
              if(!Settings.v.clip||!A||S.phase==='downloading') return;
              if(A.web){ if(navigator.clipboard&&navigator.clipboard.readText) navigator.clipboard.readText().then(x=>this.showClip(x)).catch(()=>{}); return; }
              let txt=''; try{ txt=A.getClipboard(); }catch(e){} this.showClip(txt);
            },
            showClip(txt){
              const u=this.extractUrl(txt); const box=$('#suggestBox');
              if(!u||u===S.clipSeen||u===$('#url').value.trim()||!detectPlatform(u)) return;
              S.clipSeen=u;
              box.innerHTML=`<div class="suggest">${ic('i-clip','sm')}<div><b>${t('clipFound')}</b><code>${esc(u)}</code></div><button class="btn primary" style="height:38px;padding:0 14px;font-size:.84rem" data-use>${t('use')}</button><button class="clear-btn" data-dis>${ic('i-x','xs')}</button></div>`;
              box.onclick=e=>{ if(e.target.closest('[data-use]')){ $('#url').value=u; box.innerHTML=''; this.validate(); this.analyze(); }
                else if(e.target.closest('[data-dis]')) box.innerHTML=''; };
            },
            setBtn(state){
              const b=$('#analyzeBtn'), l=$('#anLbl'); b.dataset.state=state;
              l.innerHTML = state==='analyzing' ? `<span class="spinner"></span>${t('analyzing')}`
                : state==='success' ? ic('i-check')+t('analyzed')
                : state==='error' ? ic('i-alert')+t('failed')
                : ic('i-sparkle')+t('analyze');
            },
            statusCycle(on){
              clearInterval(this._sc); const el=$('#statusLine'); if(!on){ el.textContent=''; return; }
              let i=0; const msgs=['st1','st2','st3']; el.textContent=t(msgs[0]);
              this._sc=setInterval(()=>{ i=Math.min(i+1,2); el.textContent=t(msgs[i]); },2200);
            },
            analyze(){
              if(S.phase==='analyzing'||S.phase==='downloading') return;
              if(!this.validate()){ $('#field').classList.add('invalid'); this.setBtn('error'); haptic('error'); setTimeout(()=>this.setBtn('ready'),1300); return; }
              if(!A){ Stage.error('app'); return; }
              if(!A.isOnlineNow()){ Stage.error('offline','analyze'); this.setBtn('error'); setTimeout(()=>this.setBtn('ready'),1500); return; }
              S.url=$('#url').value.trim(); S.phase='analyzing'; S.info=null;
              $('#suggestBox').innerHTML=''; this.setBtn('analyzing'); this.statusCycle(true); Stage.render();
              A.getInfo(S.url);
            },
            onInfo(d){
              this.statusCycle(false);
              if(!d.ok){ S.phase='error'; this.setBtn('error'); haptic('error'); Stage.error(d.code,'analyze'); setTimeout(()=>this.setBtn('ready'),1600); return; }
              S.info=d; S.phase='preview';
              S.kind=Settings.v.defKind; S.container=Settings.v.defContainer; S.afmt=Settings.v.defAudio; S.br='192';
              const hs=Formats.heights(); S.quality=Settings.v.defQuality==='best'||!hs.length?'best':String(hs.find(h=>h<=+Settings.v.defQuality)||hs[hs.length-1]);
              this.setBtn('success'); haptic('success'); setTimeout(()=>this.setBtn('ready'),1100);
              Stage.render(); setTimeout(()=>$('#stage').scrollIntoView({behavior:Settings.v.reduceMotion?'auto':'smooth',block:'start'}),120);
            },
            reset(){ if(S.phase==='downloading') return; S.phase='idle'; S.info=null; Stage.render(); },
            moreSheet(){
              UI.sheet(`<h3>${t('morePlatforms')}</h3><div class="chips">${OTHER_SITES.map(s=>`<span class="chip">${s}</span>`).join('')}</div>
                <p style="color:var(--text-muted);font-size:.86rem;margin-top:14px">${t('moreNote')}</p><button class="btn primary block" style="margin-top:16px" data-x>${t('done')}</button>`,
                b=>{ $('[data-x]',b).onclick=()=>UI.closeSheet(); });
            }
          };

          /* حساب الأحجام المتوقعة من الصيغ الحقيقية التي أرجعها المحرك */
          const Formats = {
            list(){ return (S.info&&S.info.formats)||[]; },
            heights(){ return [...new Set(this.list().filter(f=>f.v&&f.h>=144).map(f=>f.h))].sort((a,b)=>b-a).slice(0,8); },
            fsize(f){ return f.size>0?f.size:(f.tbr>0&&S.info.duration>0?f.tbr*125*S.info.duration:0); },
            bestAudio(pref){ const a=this.list().filter(f=>f.a&&!f.v); if(!a.length) return null;
              const p=a.filter(f=>f.ext===pref); return (p.length?p:a).sort((x,y)=>(y.abr||y.tbr)-(x.abr||x.tbr))[0]; },
            videoSize(h){
              const prefV=S.container==='webm'?'webm':'mp4', prefA=S.container==='webm'?'webm':'m4a';
              const vids=this.list().filter(f=>f.v); if(!vids.length) return 0;
              const maxH=h==='best'?Math.max(...vids.map(f=>f.h)):+h;
              let c=vids.filter(f=>f.h&&f.h<=maxH); if(!c.length) c=vids;
              const top=Math.max(...c.map(f=>f.h||0)); c=c.filter(f=>(f.h||0)===top);
              const pref=c.filter(f=>f.ext===prefV); const v=(pref.length?pref:c).sort((x,y)=>this.fsize(y)-this.fsize(x))[0];
              let s=this.fsize(v); if(!v.a){ const a=this.bestAudio(prefA); if(a) s+=this.fsize(a); } return s;
            },
            fps(h){ return Math.max(0,...this.list().filter(f=>f.v&&f.h===h).map(f=>f.fps||0)); },
            audioSize(){
              const d=S.info&&S.info.duration||0; if(!d) return 0;
              const kbps={wav:1411,flac:900}[S.afmt]||(+S.br); return kbps*125*d;
            }
          };
          const fmtSize=b=>{ if(!b||b<=0) return '—'; const u=['B','KB','MB','GB']; let i=0; while(b>=1024&&i<3){b/=1024;i++} return (i>1?b.toFixed(1):Math.round(b))+' '+u[i]; };
          const fmtTime=s=>{ if(!s||s<0) return '—'; s=Math.round(s); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
          const qLabel=h=>h>=2160?'4K':h>=1440?'2K':h>=1080?'Full HD':h>=720?'HD':'';

          /* ════════════════════════════════════════════════════════════════
             7) منطقة النتيجة: معاينة / تقدم / نجاح / خطأ
             ════════════════════════════════════════════════════════════════ */
          const Stage = {
            render(){
              const el=$('#stage');
              if(S.phase==='preview') return this.preview(el);
              if(S.phase==='downloading') return this.progress(el);
              if(S.phase==='done') return this.success(el);
              if(S.phase==='picker') return this.pickerView(el);
              if(S.phase==='error'&&S.lastErr) return this.errorView(el);
              el.innerHTML='';
            },
            preview(el){
              const d=S.info, p=detectPlatform(S.url), hs=Formats.heights();
              const title=d.title||'—', up=d.uploader||'';
              el.innerHTML=`<div class="section-title"><h2>${t('analyzed')}</h2></div>
              <article class="card preview">
                <div class="thumb"><div class="ph">${ic('i-film','lg')}</div>${d.thumbnail?`<img src="${esc(d.thumbnail)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
                  ${p?`<span class="badge tl" style="--brand:${p.brand}"><span class="dot" style="background:${p.brand}"></span>${p.name}</span>`:''}
                  ${d.duration?`<span class="badge br">${fmtTime(d.duration)}</span>`:''}</div>
                <div class="pv-body">
                  <h3 class="pv-title">${esc(title)}</h3>
                  ${up?`<div class="pv-meta"><span class="avatar">${esc(up.trim()[0]||'•')}</span><span>${esc(up)}</span></div>`:''}
                  <div class="label"><span>${t('fileType')}</span></div>
                  <div class="seg" id="kindSeg"><span class="ind"></span>
                    <button data-k="video">${ic('i-film','sm')}${t('video')}</button><button data-k="audio">${ic('i-music','sm')}${t('audio')}</button></div>
                  <div id="kindOpts"></div>
                  <div class="est"><span>${t('estSize')} <small style="color:var(--text-muted)">(${t('approx')})</small></span><b id="estSz">—</b></div>
                  <button class="btn primary block lg" id="dlBtn" style="margin-top:14px">${ic('i-download')}<span id="dlLbl">${t('download')}</span></button>
                </div>
              </article>`;
              const seg=$('#kindSeg');
              seg.onclick=e=>{ const b=e.target.closest('[data-k]'); if(!b) return; S.kind=b.dataset.k; haptic(); this.opts(); };
              $('#dlBtn').onclick=()=>this.start();
              this.opts(hs);
            },
            segInd(seg){
              const on=$('button.on',seg), ind=$('.ind',seg); if(!on) return;
              ind.style.width=on.offsetWidth+'px'; ind.style.transform=`translateX(${on.offsetLeft}px)`;
            },
            opts(){
              const seg=$('#kindSeg'); $$('button',seg).forEach(b=>b.classList.toggle('on',b.dataset.k===S.kind)); requestAnimationFrame(()=>this.segInd(seg));
              const st=!!(S.info&&S.info.static), box=$('#kindOpts'), hs=st?[2160,1440,1080,720,480,360,240,144]:Formats.heights();
              if(S.kind==='video'){
                const cont=st?['mp4','webm']:['mp4','webm','mkv']; if(!cont.includes(S.container)) S.container='mp4';
                box.innerHTML=`<div class="label"><span>${t('container')}</span></div><div class="chips" id="contC">${cont.map(c=>`<button class="chip ${S.container===c?'on':''}" data-v="${c}">${c.toUpperCase()} <small>${t('c_'+c+(st?'s':''))}</small></button>`).join('')}</div>
                  <div class="label"><span>${t('quality')}</span></div><div class="qlist" id="qList">${
                    [{v:'best',q:t('best'),tag:t('auto')}].concat(hs.map(h=>{ const f=Formats.fps(h); return {v:String(h),q:h+'p',tag:[qLabel(h),f>30?Math.round(f)+'fps':''].filter(Boolean).join(' · ')}; }))
                    .map(o=>`<button class="qrow ${S.quality===o.v?'on':''}" data-v="${o.v}"><span class="radio"></span><span class="q">${o.q}</span>${o.tag?`<span class="tag">${o.tag}</span>`:''}${st?'':`<span class="sz">${fmtSize(Formats.videoSize(o.v))}</span>`}</button>`).join('')}</div>`;
                $('#contC').onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b) return; S.container=b.dataset.v; haptic(); this.opts(); };
                $('#qList').onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b) return; S.quality=b.dataset.v; haptic(); $$('#qList .qrow').forEach(x=>x.classList.toggle('on',x===b)); this.est(); };
              }else{
                const af=st?['mp3','opus','ogg','wav']:['mp3','m4a','opus','wav','flac']; if(!af.includes(S.afmt)) S.afmt='mp3';
                const lossy=['mp3','m4a','opus','ogg'].includes(S.afmt), brs=st?['320','256','128','96','64']:['320','256','192','128']; if(!brs.includes(S.br)) S.br=st?'256':'192';
                box.innerHTML=`<div class="label"><span>${t('format')}</span></div><div class="chips" id="afC">${af.map(c=>`<button class="chip ${S.afmt===c?'on':''}" data-v="${c}">${c.toUpperCase()} <small>${t('a_'+c)}</small></button>`).join('')}</div>
                  ${lossy?`<div class="label"><span>${t('bitrate')}</span></div><div class="chips" id="brC">${brs.map(b=>`<button class="chip ${S.br===b?'on':''}" data-v="${b}">${b} kbps</button>`).join('')}</div>`
                    :`<div class="label"><span>${t('quality')}</span></div><div class="chips"><span class="chip on">${t('lossless')}</span></div>`}`;
                $('#afC').onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b) return; S.afmt=b.dataset.v; haptic(); this.opts(); };
                const br=$('#brC'); if(br) br.onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b) return; S.br=b.dataset.v; haptic(); $$('#brC .chip').forEach(x=>x.classList.toggle('on',x===b)); this.est(); };
              }
              this.est();
            },
            est(){
              const s=S.kind==='video'?Formats.videoSize(S.quality):Formats.audioSize();
              $('#estSz').textContent=s?fmtSize(s):t(S.info&&S.info.static?'sizeLater':'unknownSize');
              $('#dlLbl').textContent=t('download')+(s?' · '+fmtSize(s):'');
            },
            suggestName(ext){
              const base=((S.info&&S.info.title)||'video').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').trim().slice(0,90)||'video';
              return base+'.'+(ext||(S.kind==='audio'?S.afmt:S.container));
            },
            mimeOf(ext){ return {mp4:'video/mp4',webm:'video/webm',mkv:'video/x-matroska',mp3:'audio/mpeg',m4a:'audio/mp4',opus:'audio/ogg',ogg:'audio/ogg',wav:'audio/wav',flac:'audio/flac',jpg:'image/jpeg',png:'image/png',gif:'image/gif'}[ext]||'application/octet-stream'; },
            async start(){
              if(!A) return;
              if(!A.isOnlineNow()){ this.error('offline','download'); return; }
              S.sink={mode:'browser'};
              if(A.web){ const name=this.suggestName();
                try{ S.sink=await Saver.prepare(name,this.mimeOf(name.split('.').pop())); }
                catch(e){ if(e&&e.name==='AbortError') return; UI.toast(t('pickFail'),'i-alert'); S.sink={mode:'browser'}; } }
              S.phase='downloading'; haptic(); this.render();
              A.download(JSON.stringify({url:S.url,kind:S.kind,quality:S.quality,container:S.container,afmt:S.afmt,br:S.br}));
            },
            async onFileReady(m){
              if(S.phase!=='downloading') return;
              this.onProgress({phase:'saving',percent:-1});
              const name=S.sink.mode==='ask'?S.sink.handle.name:(m.filename||this.suggestName(m.ext));
              try{
                const r=await Saver.save(m.url,name,m.mime||this.mimeOf(name.split('.').pop()),S.sink,
                  (got,total,speed)=>this.onProgress({phase:'saving',percent:total?Math.min(100,got*100/total):-1,got,total,speed}));
                this.onDone({filename:r.name,size:r.size||m.size||0,uri:m.serverUri||'',mime:m.mime||this.mimeOf(r.name.split('.').pop()),handleId:r.handleId||'',via:r.via,folder:r.folder||''});
              }catch(e){
                if(e&&e.name==='AbortError'){ S.phase='preview'; this.render(); UI.toast(t('cancelled')); }
                else this.error('savefail','download');
              }
            },
            onPicker(m){ if(S.phase!=='downloading') return; S.phase='picker'; S.pick=m; this.render(); },
            pickerView(el){
              const m=S.pick;
              el.innerHTML=`<div class="section-title"><h2>${t('pickItems')}</h2><small>${m.items.length}</small></div>
                <div class="gal" id="pk">${m.items.map((p,i)=>`<button class="gcard" data-i="${i}"><div class="sw" style="background:var(--grad-secondary) center/cover no-repeat${p.thumb?` url('${esc(p.thumb)}')`:''}"></div><b>${t(p.type==='photo'?'photo':'video')} ${i+1}</b><small>${t('download')}</small></button>`).join('')}</div>
                ${m.audio?`<button class="btn secondary block" id="pkA" style="margin-top:12px">${ic('i-music','sm')}${t('dlAudioTrack')}</button>`:''}`;
              const go=async(url,ext)=>{ const name=this.suggestName(ext); let sink={mode:'browser'};
                try{ sink=await Saver.prepare(name,this.mimeOf(ext)); }catch(e){ if(e&&e.name==='AbortError') return; }
                S.sink=sink; S.phase='downloading'; this.render(); this.onFileReady({url,filename:name,ext}); };
              $('#pk').onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; const p=m.items[+b.dataset.i]; go(p.url,p.type==='photo'?'jpg':p.type==='gif'?'gif':'mp4'); };
              const pa=$('#pkA'); if(pa) pa.onclick=()=>go(m.audio,(m.audioFilename||'').split('.').pop()||'mp3');
            },
            progress(el){
              el.innerHTML=`<div class="section-title"><h2>${t('downloading')}</h2></div>
              <div class="card prog-card">
                <div class="ring indet" id="ring"><svg viewBox="0 0 150 150"><circle class="track" cx="75" cy="75" r="65"/><circle class="val" id="ringVal" cx="75" cy="75" r="65"/></svg><div class="pct" id="pct">0<small>%</small></div></div>
                <div class="phase" id="phase">${t('preparing')}</div>
                <div class="phase-sub">${esc(S.info&&S.info.title||'')}</div>
                <div class="stats"><div class="stat"><b id="spd">—</b><span>${t('speed')}</span></div><div class="stat"><b id="eta">—</b><span>${t('remaining')}</span></div><div class="stat"><b id="sz">—</b><span>${t('size')}</span></div></div>
                <button class="btn block cancel-btn" id="cancelBtn">${ic('i-x','sm')}${t('cancel')}</button>
              </div>`;
              $('#cancelBtn').onclick=()=>{ A&&A.cancel(); haptic(); };
            },
            onProgress(d){
              if(S.phase!=='downloading') return;
              const ring=$('#ring'); if(!ring) return;
              const C_=408.4, det=d.percent>=0&&d.phase!=='serverProc';
              ring.classList.toggle('indet',!det);
              if(det){ $('#ringVal').style.strokeDashoffset=C_*(1-d.percent/100); $('#pct').innerHTML=Math.floor(d.percent)+'<small>%</small>'; }
              else $('#pct').innerHTML='<small>…</small>';
              const lbl={server:det?'srvDownloading':'srvPrep',serverProc:S.kind==='audio'?'processing_a':'processing_v',saving:'savingDevice',
                downloading:'downloading',processing:S.kind==='audio'?'processing_a':'processing_v'}[d.phase]||'preparing';
              $('#phase').textContent=t(lbl);
              if(d.got!==undefined){
                $('#sz').textContent=fmtSize(d.total||d.got);
                $('#spd').textContent=d.speed>0?fmtSize(d.speed)+'/s':'—';
                $('#eta').textContent=d.speed>0&&d.total?fmtTime((d.total-d.got)/d.speed):'—';
              }else{
                if(d.speed) $('#spd').textContent=d.speed;
                if(d.eta) $('#eta').textContent=fmtTime(d.eta);
                if(d.size) $('#sz').textContent=d.size;
              }
            },
            onDone(d){
              S.phase='done'; haptic('success');
              const it={id:uid(),name:d.filename,uri:d.uri||'',mime:d.mime||'',size:d.size||0,t:Date.now(),thumb:S.info&&S.info.thumbnail||'',title:S.info&&S.info.title||'',
                platform:(detectPlatform(S.url)||{}).id||'',kind:((d.mime||'').startsWith('audio')||(!d.mime&&S.kind==='audio'))?'audio':'video',fav:false,
                location:d.location||'',handleId:d.handleId||'',via:d.via||'',folder:d.folder||'',source:S.url};
              S.lastDone=d; S.lastItem=it; Downloads.add(it); this.render();
            },
            success(el){
              const it=S.lastItem, web=A&&A.web;
              const loc=!web?(it.location||'Download/VideoDownloader'):it.via==='ask'?t('locChosen'):it.via==='folder'?t('locFolder',{f:it.folder}):t('browserDl');
              const browserOnly=web&&it.via==='browser'&&!it.uri;
              el.innerHTML=`<div class="card success">
                <div class="check-anim"><svg viewBox="0 0 104 104"><circle class="disc" cx="52" cy="52" r="44"/><circle class="c" cx="52" cy="52" r="46" transform="rotate(-90 52 52)"/><path class="k" d="M33 53l13 13 25-27"/></svg></div>
                <h3>${t(browserOnly?'dlStartedT':'doneT')}</h3>
                ${browserOnly?`<p style="color:var(--text-secondary);font-size:.88rem;margin-top:6px">${t('browserDlStarted')}</p>`:''}
                <div class="file-info">
                  <div class="r"><span>${t('fileName')}</span><b dir="auto">${esc(it.name)}</b></div>
                  ${it.size?`<div class="r"><span>${t('size')}</span><b dir="ltr" style="text-align:start">${fmtSize(it.size)}</b></div>`:''}
                  <div class="r"><span>${t('location')}</span><b dir="auto">${esc(loc)}</b></div>
                </div>
                ${browserOnly?'':`<button class="btn primary block lg" id="sOpen" style="margin-top:16px">${ic('i-play','sm')}${t('open')}</button>`}
                <div class="btn-row"><button class="btn secondary" id="sShare">${ic('i-share','sm')}${t('share')}</button><button class="btn secondary" id="sAgain">${ic('i-plus','sm')}${t('another')}</button></div>
              </div>`;
              const o=$('#sOpen'); if(o) o.onclick=()=>Files.open(it);
              $('#sShare').onclick=()=>Files.share(it);
              $('#sAgain').onclick=()=>{ S.phase='idle'; S.info=null; $('#url').value=''; Home.validate(); Home.select(null); this.render(); window.scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>$('#url').focus(),300); };
              setTimeout(()=>el.scrollIntoView({behavior:Settings.v.reduceMotion?'auto':'smooth',block:'start'}),80);
            },
            error(code,from){ S.phase='error'; S.lastErr={code,from}; haptic('error'); this.render(); },
            errorView(el){
              const {code,from}=S.lastErr;
              el.innerHTML=`<div class="card err-card"><div class="err-ic">${ic('i-alert','lg')}</div><h3>${t('errT')}</h3><p>${esc(t('e_'+code))}</p>
                <div class="btn-row"><button class="btn secondary" id="eBack">${t('back')}</button><button class="btn primary" id="eRetry">${ic('i-refresh','sm')}${t('retry')}</button></div></div>`;
              $('#eBack').onclick=()=>{ S.phase=S.info?'preview':'idle'; this.render(); };
              $('#eRetry').onclick=()=>{ if(from==='download'&&S.info){ S.phase='preview'; this.start(); } else { S.phase='idle'; Home.analyze(); } };
            }
          };

          /* ════════════════════════════════════════════════════════════════
             8) مدير التحميلات + المفضلة
             ════════════════════════════════════════════════════════════════ */
          const Downloads = {
            items:[], q:'', filter:'all',
            load(){ this.items=Store.get('history',[]); },
            save(){ Store.set('history',this.items.slice(0,300)); },
            add(it){ this.items.unshift(it); this.save(); },
            verify(){
              if(!A||!this.items.length) return;
              if(A.web){ Files.verify(this.items).then(()=>{ this.save(); this.rerender(); }); return; }
              try{ const res=JSON.parse(A.filesExist(JSON.stringify(this.items.map(x=>x.uri||'')))); res.forEach((ok,i)=>this.items[i].missing=!ok); }catch(e){}
            },
            init(){
              $('#dlSearch').addEventListener('input',e=>{ this.q=e.target.value.trim().toLowerCase(); this.render(); });
              $('#dlFolder').onclick=()=>A&&A.openDownloads();
              $('#sortBtn').onclick=()=>this.sortSheet();
              $('#viewBtn').onclick=()=>{ Settings.set('view',Settings.v.view==='grid'?'list':'grid'); haptic(); this.render(); };
              $('#dlFilters').onclick=e=>{ const b=e.target.closest('[data-f]'); if(!b) return; this.filter=b.dataset.f; haptic(); this.render(); };
              const act=e=>{
                const b=e.target.closest('[data-act]'); if(!b) return; const it=this.items.find(x=>x.id===b.closest('[data-id]').dataset.id); if(!it) return;
                haptic(); const a=b.dataset.act;
                if(a==='open') Files.open(it); else if(a==='share') Files.share(it); else if(a==='more') this.itemSheet(it);
              };
              $('#dlList').onclick=act; $('#favList').onclick=act;
            },
            view(list){
              const kindLbl=k=>k==='audio'?t('audio'):t('video');
              return list.map((x,i)=>`<div class="item ${x.missing?'missing':''}" data-id="${x.id}" style="animation-delay:${Math.min(i,8)*30}ms">
                <div class="th">${x.thumb?`<img src="${esc(x.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}${ic(x.kind==='audio'?'i-music':'i-film')}<span class="kind">${ic(x.kind==='audio'?'i-music':'i-film')}</span></div>
                <div class="info"><div class="nm" dir="auto">${x.fav?`<svg class="i xs fav" style="fill:currentColor;vertical-align:-2px"><use href="#i-star"/></svg> `:''}${esc(x.title||x.name)}</div>
                  <div class="mt"><span class="ext">${esc((x.name.split('.').pop()||'').toUpperCase())}</span><span>${kindLbl(x.kind)}</span><span dir="ltr">${fmtSize(x.size)}</span><span>${new Date(x.t).toLocaleDateString(LANG==='ar'?'ar':'en',{day:'numeric',month:'short',year:'numeric'})}</span>${x.missing?`<span class="miss">${t('missing')}</span>`:x.expired?`<span class="miss">${t('expired')}</span>`:''}</div></div>
                <div class="acts"><button class="play" data-act="open" aria-label="${t('open')}">${ic('i-play','sm')}</button><button data-act="share" aria-label="${t('share')}">${ic('i-share','sm')}</button><button data-act="more" aria-label="${t('more')}">${ic('i-more','sm')}</button></div>
              </div>`).join('');
            },
            sorted(list){
              const s=Settings.v.sort, L=[...list];
              return s==='old'?L.sort((a,b)=>a.t-b.t):s==='big'?L.sort((a,b)=>b.size-a.size):s==='small'?L.sort((a,b)=>a.size-b.size)
                :s==='name'?L.sort((a,b)=>(a.title||a.name).localeCompare(b.title||b.name,LANG)):L.sort((a,b)=>b.t-a.t);
            },
            render(){
              const counts={all:this.items.length,video:this.items.filter(x=>x.kind==='video').length,audio:this.items.filter(x=>x.kind==='audio').length,fav:this.items.filter(x=>x.fav).length};
              $('#dlFilters').innerHTML=[['all','all'],['video','videos'],['audio','audios'],['fav','favorites']].map(([f,k])=>`<button class="chip ${this.filter===f?'on':''}" data-f="${f}">${t(k)} <small>${counts[f]}</small></button>`).join('');
              $('#viewBtn use').setAttribute('href',Settings.v.view==='grid'?'#i-list':'#i-grid');
              let list=this.items.filter(x=>this.filter==='all'||(this.filter==='fav'?x.fav:x.kind===this.filter));
              if(this.q) list=list.filter(x=>(x.title+' '+x.name).toLowerCase().includes(this.q));
              list=this.sorted(list);
              const el=$('#dlList'); el.classList.toggle('grid',Settings.v.view==='grid');
              $('#dlCount').textContent=list.length?t('items',{n:list.length}):'';
              if(!this.items.length) el.innerHTML=this.empty(t('emptyT'),t('emptyP'),true);
              else if(!list.length) el.innerHTML=this.empty(t('noResults'),'',false);
              else el.innerHTML=this.view(list);
            },
            renderFav(){
              const list=this.sorted(this.items.filter(x=>x.fav)); const el=$('#favList');
              el.innerHTML=list.length?this.view(list):this.empty(t('favEmptyT'),t('favEmptyP'),false,'i-heart');
            },
            empty(h,p,cta,icon='i-download'){
              return `<div class="empty" style="grid-column:1/-1"><svg class="art" viewBox="0 0 150 120" fill="none">
                <defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".9"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".25"/></linearGradient></defs>
                <rect x="25" y="22" width="100" height="76" rx="18" fill="var(--accent-soft)" stroke="var(--border)"/><rect x="38" y="12" width="74" height="10" rx="5" fill="var(--btn-bg)"/>
                <circle cx="75" cy="60" r="22" fill="url(#eg)"/><g transform="translate(63 48)" fill="none" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><use href="#${icon}" width="24" height="24"/></g>
                <circle cx="122" cy="26" r="4" fill="var(--accent)" opacity=".5"/><circle cx="24" cy="92" r="3" fill="var(--accent)" opacity=".4"/></svg>
                <h3>${esc(h)}</h3>${p?`<p>${esc(p)}</p>`:'<p></p>'}${cta?`<button class="btn primary" data-go="home">${ic('i-plus','sm')}${t('startNow')}</button>`:''}</div>`;
            },
            rerender(){ this.render(); if(UI.page==='favorites') this.renderFav(); },
            sortSheet(){
              const opts=['new','old','big','small','name'];
              UI.sheet(`<h3>${t('sort')}</h3><div class="opt-list">${opts.map(o=>`<button data-s="${o}">${ic('i-sort','sm')}${t('s_'+o)}${Settings.v.sort===o?`<span class="ck">${ic('i-check','sm')}</span>`:''}</button>`).join('')}</div>`,
                b=>b.onclick=e=>{ const x=e.target.closest('[data-s]'); if(!x) return; Settings.set('sort',x.dataset.s); UI.closeSheet(); this.render(); });
            },
            itemSheet(it){
              const web=A&&A.web, canDel=!web||it.handleId||it.uri;
              UI.sheet(`<h3 dir="auto" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.title||it.name)}</h3><div class="opt-list">
                <button data-a="open">${ic('i-play','sm')}${t('open')}</button>
                <button data-a="share">${ic('i-share','sm')}${t('share')}</button>
                <button data-a="fav">${ic(it.fav?'i-heart':'i-star','sm')}${t(it.fav?'remFav':'addFav')}</button>
                ${it.source?`<button data-a="src">${ic('i-link','sm')}${t('openSource')}</button>`:''}
                <button data-a="rem">${ic('i-x','sm')}${t('removeList')}</button>
                ${canDel?`<button data-a="del" class="danger">${ic('i-trash','sm')}${t(web&&!it.handleId?'deleteServer':'deleteFile')}</button>`:''}</div>`,
                b=>b.onclick=e=>{ const x=e.target.closest('[data-a]'); if(!x) return; const a=x.dataset.a; UI.closeSheet();
                  if(a==='open') Files.open(it);
                  else if(a==='share') Files.share(it);
                  else if(a==='src') window.open(it.source,'_blank','noopener');
                  else if(a==='fav'){ it.fav=!it.fav; this.save(); this.rerender(); }
                  else if(a==='rem'){ this.items=this.items.filter(y=>y!==it); this.save(); this.rerender(); UI.toast(t('removed'),'i-check'); }
                  else if(a==='del') setTimeout(()=>UI.confirm(t(web&&!it.handleId?'delConfirmWeb':'delConfirm'),t('delete'),async()=>{
                    const ok=web?await Files.remove(it):(A?A.deleteFile(it.uri):false);
                    if(ok||it.missing){ this.items=this.items.filter(y=>y!==it); this.save(); this.rerender(); UI.toast(t('deleted'),'i-check'); }
                    else UI.toast(t('delFail'),'i-alert');
                  }),300);
                });
            }
          };

          /* ════════════════════════════════════════════════════════════════
             9) Gradient Theme Studio
             ════════════════════════════════════════════════════════════════ */
          const Studio = {
            tab:'library', cat:'all', saved:[],
            load(){ this.saved=Store.get('themes',[]); },
            persist(){ Store.set('themes',this.saved); },
            init(){ $('#studioTabs').onclick=e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; this.tab=b.dataset.tab; haptic(); this.render(); }; },
            render(){
              $$('#studioTabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===this.tab));
              const body=$('#studioBody');
              ({library:()=>this.library(body),editor:()=>this.editor(body),styles:()=>this.styles(body),mine:()=>this.mine(body)})[this.tab]();
            },
            sameGrad(a,b){ return JSON.stringify(a.stops.map(s=>s.c))===JSON.stringify(b.stops.map(s=>s.c)); },
            library(body){
              const list=this.cat==='all'?LIB:LIB.filter(x=>x.cat===this.cat);
              body.innerHTML=`<div class="cats" id="cats">${['all',...CATS].map(c=>`<button class="chip ${this.cat===c?'on':''}" data-c="${c}">${c==='all'?t('catAll'):c}</button>`).join('')}</div>
                <div class="gal" id="gal">${list.map(g=>`<button class="gcard ${this.sameGrad(g.grad,Theme.cur.grad)?'on':''}" data-id="${g.id}"><div class="sw" style="background:${gradCss(g.grad)}"></div><span class="ok">${ic('i-check')}</span><b>${g.name}</b><small>${g.cat}</small></button>`).join('')}</div>`;
              $('#cats').onclick=e=>{ const b=e.target.closest('[data-c]'); if(!b) return; this.cat=b.dataset.c; haptic(); this.library(body); };
              $('#gal').onclick=e=>{ const b=e.target.closest('[data-id]'); if(!b) return; const g=LIB.find(x=>x.id===b.dataset.id);
                Theme.set({...Theme.cur,id:'',name:g.name,grad:structuredCloneSafe(g.grad)}); haptic('success');
                $$('#gal .gcard').forEach(x=>x.classList.toggle('on',x===b)); UI.toast(t('applied',{n:g.name}),'i-check'); };
            },
            /* ── المحرر ── */
            editor(body){
              const g=Theme.cur.grad;
              const posPresets=[['50% 50%','center'],['50% 0%','top'],['50% 100%','bottom'],['100% 0%','topRight'],['0% 100%','bottomLeft']];
              const [px,py]=(g.pos||'50% 50%').split(' ').map(v=>parseFloat(v));
              body.innerHTML=`<div class="card">
                <div class="big-sw" id="bigSw" style="background:${gradCss(g)}"><code id="cssOut">${esc(gradCss(g))}</code></div>
                <div class="label"><span>${t('gType')}</span></div>
                <div class="chips" id="gType">${['linear','radial','conic'].map(x=>`<button class="chip ${g.type===x?'on':''}" data-v="${x}">${t(x)}</button>`).join('')}</div>
                ${g.type!=='radial'?`<div class="label"><span>${t('angle')}</span></div>
                  <div class="chips" id="angP">${[0,45,90,135,180,270].map(a=>`<button class="chip ${+g.angle===a?'on':''}" data-v="${a}" dir="ltr">${a}°</button>`).join('')}</div>
                  <div class="ctrl"><input type="range" min="0" max="360" value="${g.angle||0}" id="angR"><output id="angO">${g.angle||0}°</output></div>`:''}
                ${g.type!=='linear'?`<div class="label"><span>${t('position')}</span></div>
                  <div class="chips" id="posP">${posPresets.map(([v,k])=>`<button class="chip ${g.pos===v?'on':''}" data-v="${v}">${t(k)}</button>`).join('')}</div>
                  <div class="ctrl"><span style="font-size:.8rem;color:var(--text-muted)">X</span><input type="range" min="0" max="100" value="${px}" id="posX"><output id="posXO">${px}%</output></div>
                  <div class="ctrl"><span style="font-size:.8rem;color:var(--text-muted)">Y</span><input type="range" min="0" max="100" value="${py}" id="posY"><output id="posYO">${py}%</output></div>`:''}
              </div>
              <div class="card">
                <div class="label" style="margin-top:2px"><span>${t('colors')} (${g.stops.length}/4)</span><button class="btn ghost" id="revB" style="height:28px;padding:0 4px;font-size:.8rem">${ic('i-reverse','xs')}${t('reverse')}</button></div>
                <div id="stops">${g.stops.map((s,i)=>`<div class="stop" data-i="${i}">
                  <button class="swb" data-act="pick" style="background:linear-gradient(${C.rgba(s.c,s.a??1)},${C.rgba(s.c,s.a??1)}),var(--chk)" aria-label="${t('pickColor')}"></button>
                  <div class="mid"><code>${s.c.toUpperCase()}${(s.a??1)<1?' · '+Math.round((s.a??1)*100)+'%':''}</code>
                    <input type="range" min="0" max="100" value="${s.p}" data-act="pos" aria-label="${t('stopPos')}"></div>
                  <div class="tools"><button data-act="up" ${i===0?'disabled':''}>${ic('i-up','sm')}</button><button data-act="down" ${i===g.stops.length-1?'disabled':''}>${ic('i-down','sm')}</button>
                    <button data-act="del" ${g.stops.length<=2?'disabled':''}>${ic('i-trash','sm')}</button></div></div>`).join('')}</div>
                ${g.stops.length<4?`<button class="btn secondary block" id="addStop" style="margin-top:10px;height:46px">${ic('i-plus','sm')}${t('addColor')}</button>`:''}
              </div>
              <div class="card">
                <div class="label" style="margin-top:2px"><span>${t('themeName')}</span></div>
                <input class="tinput" id="tName" maxlength="40" value="${esc(Theme.cur.name||'')}">
                <button class="btn primary block" id="saveT" style="margin-top:12px">${ic('i-star','sm')}${t('saveTheme')}</button>
              </div>`;
              const upd=(re)=>{ const gg=Theme.cur.grad; $('#bigSw').style.background=gradCss(gg); $('#cssOut').textContent=gradCss(gg);
                cancelAnimationFrame(this._raf); this._raf=requestAnimationFrame(()=>Theme.set({...Theme.cur,id:''},false)); if(re) this.editor(body); };
              $('#gType').onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b) return; g.type=b.dataset.v; if(g.type!=='linear'&&!g.pos) g.pos='50% 50%'; upd(true); };
              const angR=$('#angR');
              if(angR){ angR.oninput=()=>{ g.angle=+angR.value; $('#angO').textContent=g.angle+'°'; $$('#angP .chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===g.angle)); upd(); };
                $('#angP').onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b) return; g.angle=+b.dataset.v; upd(true); }; }
              const posX=$('#posX');
              if(posX){ const setPos=()=>{ g.pos=$('#posX').value+'% '+$('#posY').value+'%'; $('#posXO').textContent=$('#posX').value+'%'; $('#posYO').textContent=$('#posY').value+'%'; $$('#posP .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===g.pos)); upd(); };
                posX.oninput=setPos; $('#posY').oninput=setPos; $('#posP').onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b) return; g.pos=b.dataset.v; upd(true); }; }
              $('#revB').onclick=()=>{ const cs=g.stops.map(s=>({c:s.c,a:s.a})).reverse(); g.stops.forEach((s,i)=>{ s.c=cs[i].c; s.a=cs[i].a; }); upd(true); };
              $('#stops').addEventListener('input',e=>{ if(e.target.dataset.act!=='pos') return; const i=+e.target.closest('[data-i]').dataset.i; g.stops[i].p=+e.target.value; upd(); });
              $('#stops').onclick=e=>{ const b=e.target.closest('[data-act]'); if(!b||b.dataset.act==='pos') return; const i=+b.closest('[data-i]').dataset.i, a=b.dataset.act; haptic();
                if(a==='pick') return Picker.open(g.stops[i].c,g.stops[i].a??1,(c,al)=>{ g.stops[i].c=c; g.stops[i].a=al; upd(); },()=>this.editor(body));
                if(a==='up'||a==='down'){ const j=a==='up'?i-1:i+1; const A_=g.stops[i],B_=g.stops[j]; [A_.c,B_.c]=[B_.c,A_.c]; [A_.a,B_.a]=[B_.a,A_.a]; }
                if(a==='del'&&g.stops.length>2){ g.stops.splice(i,1); }
                upd(true); };
              const add=$('#addStop'); if(add) add.onclick=()=>{ const last=g.stops[g.stops.length-1]; const h=C.rgbToHsl(C.hexToRgb(last.c));
                g.stops.push({c:C.rgbToHex(C.hslToRgb({h:(h.h+40)%360,s:Math.max(h.s,50),l:clamp(h.l,35,65)})),a:1,p:100});
                g.stops.forEach((s,k)=>s.p=Math.round(k*100/(g.stops.length-1))); upd(true); };
              $('#saveT').onclick=()=>{ const name=$('#tName').value.trim()||Theme.cur.name||'My Theme';
                const th={...structuredCloneSafe(Theme.cur),id:uid(),name}; this.saved.unshift(th); this.persist(); Theme.set(th,false); haptic('success'); UI.toast(t('saved'),'i-check'); };
            },
            /* ── الأنماط البصرية ── */
            styles(body){
              const g=gradCss(Theme.cur.grad);
              const demo=k=>{ const st=STYLES[k], dk=st.mode==='dark';
                const bg=dk?(k==='elegantMono'?'#121214':k==='neonGlow'?'#07070b':'#0d0e18'):(k==='frostedGlass'?'linear-gradient(135deg,#e9e4ff,#dff3ff)':'#f6f6fa');
                const card=dk?(st.card==='glass'?'rgba(255,255,255,.08)':st.card==='tonal'?'#23253a':'#181a28'):(st.card==='frost'?'rgba(255,255,255,.6)':'#fff');
                const glow=st.glow>.6?`box-shadow:0 0 14px var(--glow)`:'';
                return `<div class="demo" style="background:${bg}">${st.ambient>.5?`<i style="position:absolute;inset:-30%;background:radial-gradient(circle at 80% 10%,var(--c1),transparent 55%);opacity:.8"></i>`:''}${st.bgGrad?`<i style="position:absolute;inset:0 0 50%;background:${g};opacity:.35"></i>`:''}
                  <i style="position:relative;height:22px;background:${card};border:1px solid ${dk?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)'};border-radius:${st.radius/3}px"></i>
                  <i style="position:relative;height:16px;margin-top:7px;width:70%;background:${card};border-radius:${st.radius/3}px"></i>
                  <i style="position:relative;height:18px;margin-top:7px;background:${g};border-radius:${st.radius/3}px;${glow}"></i></div>`; };
              body.innerHTML=`<div class="style-grid" id="sg">${Object.keys(STYLES).map(k=>`<button class="scard ${Theme.cur.style===k?'on':''}" data-s="${k}">${demo(k)}<b>${t('st_'+k)}</b><small>${t('sd_'+k)}</small></button>`).join('')}</div>`;
              $('#sg').onclick=e=>{ const b=e.target.closest('[data-s]'); if(!b) return; Theme.set({...Theme.cur,style:b.dataset.s}); haptic('success'); $$('#sg .scard').forEach(x=>x.classList.toggle('on',x===b)); };
            },
            /* ── ثيماتي ── */
            mine(body){
              const def=Store.get('defaultTheme','');
              body.innerHTML=`<div class="row-btns" style="margin-top:4px"><button class="btn primary" id="mSave">${ic('i-star','sm')}${t('saveCurrent')}</button><button class="btn secondary" id="mRestore">${ic('i-restore','sm')}${t('restore')}</button>
                <button class="btn secondary" id="mExp">${ic('i-upload','sm')}${t('exportT')}</button><button class="btn secondary" id="mImp">${ic('i-download','sm')}${t('importT')}</button></div>
                <div style="margin-top:16px" id="mList">${this.saved.length?this.saved.map(th=>`<div class="mytheme ${Theme.cur.id===th.id?'cur':''}" data-id="${th.id}">
                  <div class="sw" style="background:${gradCss(th.grad)}"></div><div class="inf"><b>${esc(th.name)}${def===th.id?`<span class="pill">${t('isDefault')}</span>`:''}</b><small>${t('st_'+th.style)}${Theme.cur.id===th.id?' · '+t('current'):''}</small></div>
                  <button class="icon-btn plain" data-a="apply" aria-label="${t('apply')}">${ic('i-check','sm')}</button><button class="icon-btn plain" data-a="menu">${ic('i-more','sm')}</button></div>`).join('')
                :`<div class="empty" style="padding:24px 10px"><p>${t('mineEmpty')}</p><button class="btn secondary" data-tabgo="editor">${ic('i-drop','sm')}${t('tEditor')}</button></div>`}</div>`;
              const re=()=>this.mine(body);
              $('#mSave').onclick=()=>UI.prompt(t('themeName'),Theme.cur.name||'',name=>{ const th={...structuredCloneSafe(Theme.cur),id:uid(),name}; this.saved.unshift(th); this.persist(); Theme.set(th,false); UI.toast(t('saved'),'i-check'); re(); });
              $('#mRestore').onclick=()=>{ const d=this.saved.find(x=>x.id===def)||FACTORY; Theme.set(structuredCloneSafe(d)); UI.toast(t('restored'),'i-check'); re(); };
              $('#mExp').onclick=()=>{ const data=JSON.stringify({app:'video-downloader-theme',v:1,current:Theme.cur,themes:this.saved}); A?A.shareText(data):UI.toast(data.slice(0,60)); };
              $('#mImp').onclick=()=>UI.sheet(`<h3>${t('importT')}</h3><p style="color:var(--text-muted);font-size:.85rem;margin-bottom:10px">${t('importHint')}</p><textarea class="tinput" id="impT"></textarea>
                <button class="btn primary block" id="impGo" style="margin-top:12px">${t('import')}</button>`,b=>{ $('#impGo',b).onclick=()=>{
                  try{ const j=JSON.parse($('#impT',b).value); const arr=(j.themes||[]).concat(j.current?[j.current]:[]).filter(x=>x&&x.grad&&Array.isArray(x.grad.stops)&&x.grad.stops.length>=2&&x.grad.stops.every(s=>/^#[0-9a-f]{6}$/i.test(s.c)));
                    if(!arr.length) throw 0; arr.forEach(x=>this.saved.unshift({id:uid(),name:String(x.name||'Imported').slice(0,40),grad:x.grad,style:STYLES[x.style]?x.style:'darkLuxury'}));
                    this.persist(); UI.closeSheet(); UI.toast(t('imported',{n:arr.length}),'i-check'); re(); }catch(e){ UI.toast(t('importBad'),'i-alert'); } }; });
              const tg=$('[data-tabgo]',body); if(tg) tg.onclick=()=>{ this.tab='editor'; this.render(); };
              $('#mList').onclick=e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const th=this.saved.find(x=>x.id===b.closest('[data-id]').dataset.id); haptic();
                if(b.dataset.a==='apply'){ Theme.set(structuredCloneSafe(th)); re(); return; }
                UI.sheet(`<h3>${esc(th.name)}</h3><div class="opt-list"><button data-m="apply">${ic('i-check','sm')}${t('apply')}</button><button data-m="rename">${ic('i-edit','sm')}${t('rename')}</button>
                  <button data-m="dup">${ic('i-copy','sm')}${t('duplicate')}</button><button data-m="def">${ic('i-star','sm')}${t('setDefault')}</button><button data-m="del" class="danger">${ic('i-trash','sm')}${t('delTheme')}</button></div>`,
                  sb=>sb.onclick=ev=>{ const m=ev.target.closest('[data-m]'); if(!m) return; const a=m.dataset.m; UI.closeSheet();
                    if(a==='apply') Theme.set(structuredCloneSafe(th));
                    else if(a==='rename') return setTimeout(()=>UI.prompt(t('rename'),th.name,v=>{ th.name=v; if(Theme.cur.id===th.id){ Theme.cur.name=v; Theme.save(); } this.persist(); re(); }),300);
                    else if(a==='dup'){ const c={...structuredCloneSafe(th),id:uid(),name:t('copyOf')+' '+th.name}; this.saved.splice(this.saved.indexOf(th)+1,0,c); this.persist(); }
                    else if(a==='def'){ Store.set('defaultTheme',th.id); UI.toast(t('defaultSet'),'i-check'); }
                    else if(a==='del'){ this.saved=this.saved.filter(x=>x!==th); if(Store.get('defaultTheme','')===th.id) Store.set('defaultTheme',''); this.persist(); }
                    re(); });
              };
            }
          };

          /* منتقي الألوان الاحترافي: HSV + HEX/RGB/HSL + الشفافية */
          const Picker = {
            open(hex,alpha,onChange,onClose){
              const hsv=C.rgbToHsv(C.hexToRgb(hex)); let st={...hsv,a:alpha}, mode='hex';
              UI.sheet(`<h3>${t('pickColor')}</h3><div class="cp">
                <div class="cp-sv" id="sv"><span class="cp-dot" id="svDot"></span></div>
                <input type="range" class="hue" id="hue" min="0" max="360" step="1">
                <input type="range" class="alpha" id="alp" min="0" max="100" step="1">
                <div class="tabs" id="cpm" style="margin:12px 0 0"><button data-m="hex" class="on">HEX</button><button data-m="rgb">RGB</button><button data-m="hsl">HSL</button></div>
                <div class="cp-row"><div class="cp-prev"><i id="cpPrev"></i></div><div class="cp-fields" id="cpf"></div></div>
                <button class="btn primary block" id="cpDone" style="margin-top:14px">${t('done')}</button></div>`, b=>{
                const sv=$('#sv',b), dot=$('#svDot',b), hue=$('#hue',b), alp=$('#alp',b);
                const rgb=()=>C.hsvToRgb(st);
                const paint=(skipFields)=>{
                  const c=rgb(), hx=C.rgbToHex(c);
                  sv.style.background=`hsl(${st.h},100%,50%)`; dot.style.left=st.s+'%'; dot.style.top=(100-st.v)+'%'; dot.style.background=hx;
                  hue.value=st.h; alp.value=Math.round(st.a*100); alp.style.setProperty('--track',`linear-gradient(90deg,transparent,${hx}),var(--chk)`);
                  $('#cpPrev',b).style.background=C.rgba(c,st.a);
                  if(!skipFields) fields(); onChange(hx,+st.a.toFixed(2));
                };
                const fields=()=>{
                  const c=rgb(), hx=C.rgbToHex(c), h=C.rgbToHsl(c), f=$('#cpf',b), A_=Math.round(st.a*100);
                  const inp=(k,v,lbl,w)=>`<label class="${w||''}"><input data-k="${k}" value="${v}" inputmode="${k==='hex'?'text':'numeric'}">${lbl}</label>`;
                  f.innerHTML = mode==='hex' ? inp('hex',hx.toUpperCase(),'HEX','') .replace('<label class="">','<label style="grid-column:span 3">')+inp('a',A_,'A %')
                    : mode==='rgb' ? inp('r',Math.round(c.r),'R')+inp('g',Math.round(c.g),'G')+inp('b',Math.round(c.b),'B')+inp('a',A_,'A %')
                    : inp('h',Math.round(h.h),'H°')+inp('s',Math.round(h.s),'S %')+inp('l',Math.round(h.l),'L %')+inp('a',A_,'A %');
                };
                $('#cpf',b).addEventListener('input',e=>{
                  const k=e.target.dataset.k, v=e.target.value.trim(), f=$('#cpf',b), val=x=>+$(`[data-k="${x}"]`,f).value||0;
                  if(k==='a'){ st.a=clamp(+v||0,0,100)/100; return paint(true); }
                  if(mode==='hex'){ if(!/^#?[0-9a-f]{6}$/i.test(v)) return; Object.assign(st,C.rgbToHsv(C.hexToRgb(v.startsWith('#')?v:'#'+v))); }
                  else if(mode==='rgb') Object.assign(st,C.rgbToHsv({r:clamp(val('r'),0,255),g:clamp(val('g'),0,255),b:clamp(val('b'),0,255)}));
                  else Object.assign(st,C.rgbToHsv(C.hslToRgb({h:clamp(val('h'),0,360),s:clamp(val('s'),0,100),l:clamp(val('l'),0,100)})));
                  paint(true);
                });
                $('#cpm',b).onclick=e=>{ const x=e.target.closest('[data-m]'); if(!x) return; mode=x.dataset.m; $$('#cpm button',b).forEach(y=>y.classList.toggle('on',y===x)); fields(); };
                const drag=e=>{ const r=sv.getBoundingClientRect(); st.s=clamp((e.clientX-r.left)/r.width*100,0,100); st.v=clamp(100-(e.clientY-r.top)/r.height*100,0,100); paint(); };
                sv.addEventListener('pointerdown',e=>{ sv.setPointerCapture(e.pointerId); drag(e); });
                sv.addEventListener('pointermove',e=>{ if(e.buttons) drag(e); });
                hue.oninput=()=>{ st.h=+hue.value; paint(); }; alp.oninput=()=>{ st.a=+alp.value/100; paint(); };
                $('#cpDone',b).onclick=()=>{ UI.closeSheet(); onClose&&onClose(); };
                paint();
              });
              this.onClose=onClose;
            }
          };

          /* ════════════════════════════════════════════════════════════════
             10) صفحة الإعدادات
             ════════════════════════════════════════════════════════════════ */
          const SettingsPage = {
            webGroups(){
              const c=A.cfg(), m=Settings.v.saveMode||'browser';
              const opt=(k,ok)=>`<button class="set" data-svmode="${k}" ${ok?'':'disabled style="opacity:.45"'}><span class="si">${ic(k==='ask'?'i-edit':k==='folder'?'i-folder':'i-download','sm')}</span>
                <div class="st"><b>${t('sv_'+k)}</b><small>${ok?t('svd_'+k):t('notSupported')}</small></div><span class="qrow ${m===k&&ok?'on':''}" style="padding:0;border:0;background:none"><span class="radio"></span></span></button>`;
              return `<div class="section-title" id="srvSec"><h2>${t('gServer')}</h2></div>
              <div class="card" style="padding:16px">
                <div class="mini-seg" id="srvType" style="width:max-content">${[['cobalt','Cobalt'],['own',t('srvOwn')]].map(([v,l])=>`<button data-v="${v}" class="${c.type===v?'on':''}">${l}</button>`).join('')}</div>
                <div class="label"><span>${t('srvUrl')}</span></div>
                <input class="tinput" id="srvUrl" dir="ltr" inputmode="url" autocomplete="off" spellcheck="false" placeholder="${c.type==='own'?'http://127.0.0.1:5000':'https://cobalt.example.com'}" value="${esc(c.url)}">
                <div class="${c.type==='own'?'hidden':''}"><div class="label"><span>${t('srvKey')}</span></div><input class="tinput" id="srvKey" dir="ltr" type="password" autocomplete="off" value="${esc(c.apiKey)}"></div>
                <p style="color:var(--text-muted);font-size:.8rem;margin-top:10px;line-height:1.75">${t(c.type==='own'?'srvHelpOwn':'srvHelpCobalt')}</p>
                <button class="btn primary block" id="srvSave" style="margin-top:12px">${ic('i-check','sm')}${t('srvSave')}</button>
              </div>
              <div class="section-title"><h2>${t('gSave')}</h2></div>
              <div class="card group">${opt('ask',FS.canAsk)}${opt('folder',FS.canFolder)}${opt('browser',true)}
                ${FS.canFolder?`<div class="set"><span class="si">${ic('i-folder','sm')}</span><div class="st"><b dir="auto">${Settings.v.folderName?t('curFolder',{f:esc(Settings.v.folderName)}):t('noFolder')}</b></div><button class="btn secondary" id="pickDir" style="height:40px;padding:0 14px;font-size:.84rem">${t('chooseFolder')}</button></div>`:''}
              </div>
              ${!FS.canAsk?`<p class="foot" style="margin-top:10px;text-align:start">${ic('i-info','xs')} ${t('fsUnsupported')}</p>`:''}`;
            },
            webClick(e){
              const ty=e.target.closest('#srvType [data-v]');
              if(ty){ Store.set('server',{type:ty.dataset.v,url:$('#srvUrl').value.trim(),apiKey:($('#srvKey')||{value:''}).value.trim()}); haptic(); this.render(); return true; }
              if(e.target.closest('#srvSave')){ let u=$('#srvUrl').value.trim(); if(u&&!/^https?:\/\//i.test(u)) u=(/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|\[?::1)/i.test(u)?'http://':'https://')+u;
                Store.set('server',{type:A.cfg().type,url:u.replace(/\/+$/,''),apiKey:($('#srvKey')||{value:''}).value.trim()}); A.status(true); this.render(); return true; }
              const sv=e.target.closest('[data-svmode]');
              if(sv){ if(sv.disabled) return true; const k=sv.dataset.svmode; haptic();
                if(k==='folder'&&!Settings.v.folderName){ this.pickDir(); return true; }
                Settings.set('saveMode',k); this.render(); return true; }
              if(e.target.closest('#pickDir')){ this.pickDir(); return true; }
              return false;
            },
            async pickDir(){
              try{ const d=await window.showDirectoryPicker({id:'vd',mode:'readwrite',startIn:'downloads'}); await IDB.set('dir',d);
                Settings.set('folderName',d.name); Settings.set('saveMode','folder'); UI.toast(t('folderSet',{f:d.name}),'i-check'); this.render(); }catch(e){}
            },
            render(){
              const v=Settings.v, sw=(k,on)=>`<span class="switch ${on?'on':''}" data-sw="${k}" role="switch" aria-checked="${!!on}"></span>`;
              const seg=(k,opts)=>`<div class="mini-seg" data-seg="${k}">${opts.map(([val,l])=>`<button data-v="${val}" class="${String(v[k])===String(val)?'on':''}">${l}</button>`).join('')}</div>`;
              const row=(icon,title,desc,ctrl,attrs='')=>`<div class="set" ${attrs}><span class="si">${ic(icon,'sm')}</span><div class="st"><b>${title}</b>${desc?`<small>${desc}</small>`:''}</div>${ctrl}</div>`;
              let ver=''; try{ ver=A?A.version():''; }catch(e){}
              $('#settingsBody').innerHTML=`
              <div class="section-title"><h2>${t('gAppearance')}</h2></div>
              <div class="card group">
                ${row('i-lang',t('language'),'',seg('lang',[['ar','العربية'],['en','English']]))}
                <button class="set" data-go="studio"><span class="si">${ic('i-palette','sm')}</span><div class="st"><b>${t('themeStudio')}</b><small>${t('themeStudioD')}</small></div><span style="width:40px;height:26px;border-radius:8px;background:var(--grad-primary)"></span></button>
                ${row('i-motion',t('reduceMotion'),t('reduceMotionD'),sw('reduceMotion',v.reduceMotion))}
              </div>
              ${A&&A.web?this.webGroups():''}
              <div class="section-title"><h2>${t('gDownload')}</h2></div>
              <div class="card group">
                ${row('i-film',t('defType'),'',seg('defKind',[['video',t('video')],['audio',t('audio')]]))}
                <button class="set" data-pick="defQuality"><span class="si">${ic('i-hd','sm')}</span><div class="st"><b>${t('defQuality')}</b></div><span class="val" dir="ltr">${v.defQuality==='best'?t('best'):v.defQuality+'p'}</span></button>
                <button class="set" data-pick="defContainer"><span class="si">${ic('i-film','sm')}</span><div class="st"><b>${t('defContainer')}</b></div><span class="val">${v.defContainer.toUpperCase()}</span></button>
                <button class="set" data-pick="defAudio"><span class="si">${ic('i-music','sm')}</span><div class="st"><b>${t('defAudio')}</b></div><span class="val">${v.defAudio.toUpperCase()}</span></button>
                ${row('i-vibrate',t('haptics'),t('hapticsD'),sw('haptics',v.haptics))}
              </div>
              <div class="section-title"><h2>${t('gPrivacy')}</h2></div>
              <div class="card group">
                ${row('i-clip',t('clipSuggest'),t('clipSuggestD'),sw('clip',v.clip))}
                <button class="set" id="clrH"><span class="si">${ic('i-trash','sm')}</span><div class="st"><b>${t('clearHistory')}</b><small>${t('clearHistoryD')}</small></div></button>
              </div>
              <div class="section-title ${A&&A.web&&A.cfg().type!=='own'?'hidden':''}"><h2>${t('gEngine')}</h2></div>
              <div class="card group ${A&&A.web&&A.cfg().type!=='own'?'hidden':''}">
                ${row('i-cpu',t('updateEngine'),t('updateEngineD'),`<button class="btn secondary" id="updE" style="height:40px;padding:0 14px;font-size:.84rem">${ic('i-refresh','sm')}</button>`)}
              </div>
              <div class="section-title"><h2>${t('gAbout')}</h2></div>
              <div class="card group">
                ${row('i-info',t('version'),'',`<span class="val" dir="ltr">${esc(ver||'—')}</span>`)}
                ${row('i-folder',t('saveLoc'),'',`<span class="val" dir="auto">${A&&A.web?t('sv_'+Saver.mode()):'Download/VideoDownloader'}</span>`)}
              </div>
              <p class="foot">${ic('i-shield','xs')} ${t('legal')}</p>`;
              const body=$('#settingsBody');
              body.onclick=e=>{
                if(A&&A.web&&this.webClick(e)) return;
                const s=e.target.closest('[data-sw]');
                if(s){ const k=s.dataset.sw; Settings.set(k,!Settings.v[k]); haptic(); if(k==='reduceMotion') applyMotion(); this.render(); return; }
                const sg=e.target.closest('[data-seg] button');
                if(sg){ const k=sg.closest('[data-seg]').dataset.seg; Settings.set(k,sg.dataset.v); haptic();
                  if(k==='lang'){ LANG=sg.dataset.v; applyI18n(); Home.relabel(); requestAnimationFrame(()=>UI.moveInd()); }
                  this.render(); return; }
                const pk=e.target.closest('[data-pick]');
                if(pk){ const k=pk.dataset.pick, opts={defQuality:[['best',t('best')],['2160','2160p 4K'],['1440','1440p 2K'],['1080','1080p Full HD'],['720','720p HD'],['480','480p'],['360','360p']],
                    defContainer:[['mp4','MP4'],['webm','WEBM'],['mkv','MKV']],defAudio:[['mp3','MP3'],['m4a','M4A'],['opus','OPUS'],['wav','WAV'],['flac','FLAC']]}[k];
                  UI.sheet(`<h3>${t('choose')}</h3><div class="opt-list">${opts.map(([val,l])=>`<button data-v="${val}"><span dir="auto">${l}</span>${Settings.v[k]===val?`<span class="ck">${ic('i-check','sm')}</span>`:''}</button>`).join('')}</div>`,
                    b=>b.onclick=ev=>{ const x=ev.target.closest('[data-v]'); if(!x) return; Settings.set(k,x.dataset.v); UI.closeSheet(); this.render(); });
                  return; }
                if(e.target.closest('#clrH')) UI.confirm(t('clearHistory')+'؟',t('delete'),()=>{ Downloads.items=[]; Downloads.save(); UI.toast(t('cleared'),'i-check'); });
                if(e.target.closest('#updE')){ if(S.phase==='downloading') return; A&&A.updateEngine(); }
              };
            }
          };

          /* ════════════════════════════════════════════════════════════════
             11) رسائل التطبيق الأصلي (Kotlin → JS)
             ════════════════════════════════════════════════════════════════ */
          const Engine = {
            state:'preparing', code:'',
            set(state,code){
              this.state=state; this.code=code||'';
              const e=$('#engine'); e.className='engine '+(state==='ready'?'ready':(state==='error'||state==='setup')?'error':'busy');
              $('#engTxt').textContent=state==='setup'?t('eng_setup'):state==='error'?t(code==='server'?'eng_srvError':'eng_error'):t('eng_'+state);
              if(code&&state==='ready') UI.toast(t('eng_'+code),code==='updatefail'?'i-alert':'i-check');
              const sc=$('#setupCard'); if(!sc) return;
              const show=state==='setup'||(state==='error'&&code==='server');
              sc.innerHTML=show?`<div class="card" style="margin-top:14px;border-color:color-mix(in srgb,var(--warning) 40%,transparent)">
                <div style="display:flex;gap:12px;align-items:flex-start"><span class="err-ic" style="width:44px;height:44px;border-radius:14px;margin:0;color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent);border-color:color-mix(in srgb,var(--warning) 30%,transparent)">${ic('i-cpu','sm')}</span>
                <div style="flex:1"><b>${t(state==='setup'?'setupT':'eng_srvError')}</b><p style="color:var(--text-muted);font-size:.85rem;margin-top:4px;line-height:1.7">${t(state==='setup'?'setupP':'e_server')}</p></div></div>
                <button class="btn primary block" style="margin-top:12px;height:46px" data-setup>${ic('i-settings','sm')}${t('setupBtn')}</button></div>`:'';
            }
          };
          document.addEventListener('click',e=>{ if(e.target.closest('[data-setup]')){ UI.go('settings'); setTimeout(()=>{ const x=$('#srvSec'); if(x) x.scrollIntoView({behavior:'smooth',block:'start'}); },350); } });
          window.onNative = s => {
            const m = typeof s==='string' ? JSON.parse(s) : s;
            switch(m.type){
              case 'engine': Engine.set(m.state,m.code); break;
              case 'info': Home.onInfo(m); break;
              case 'progress': Stage.onProgress(m); break;
              case 'done': Stage.onDone(m); break;
              case 'fileReady': Stage.onFileReady(m); break;
              case 'picker': Stage.onPicker(m); break;
              case 'error': Stage.error(m.code,'download'); break;
              case 'cancelled': S.phase='preview'; Stage.render(); UI.toast(t('cancelled')); break;
              case 'shared': UI.go('home'); $('#url').value=m.url; Home.validate(); Home.analyze(); break;
              case 'focus': Home.checkClip(); break;
              case 'toast': UI.toast(t('e_'+m.code),'i-alert'); break;
            }
          };
          window.onBack = () => {
            if(UI.sheetOpen){ UI.closeSheet(); return true; }
            if(UI.page!=='home'){ UI.go('home'); return true; }
            if(S.phase==='picker'){ S.phase='preview'; Stage.render(); return true; }
            if(S.phase==='preview'||S.phase==='done'||S.phase==='error'){ S.phase='idle'; S.info=null; Stage.render(); return true; }
            return false;
          };

          /* ════════════════════════════════════════════════════════════════
             12) الإقلاع
             ════════════════════════════════════════════════════════════════ */
          Settings.load(); LANG=Settings.v.lang; applyMotion();
          Theme.load(); Theme.apply();
          Studio.load(); Downloads.load();
          applyI18n(); Home.init(); Downloads.init(); Studio.init();
          Engine.set(A?(A.web&&!A.cfg().url?'setup':'preparing'):'error');
          requestAnimationFrame(()=>UI.moveInd());
          setTimeout(()=>Home.checkClip(),600);
          if(A&&A.web){
            ['#hdrFolder','#dlFolder'].forEach(s=>{ const e=$(s); if(e) e.remove(); });
            window.addEventListener('focus',()=>Home.checkClip());
            window.addEventListener('offline',()=>UI.toast(t('e_offline'),'i-alert'));
            const qp=new URLSearchParams(location.search), sh=qp.get('url')||Home.extractUrl((qp.get('text')||'')+' '+(qp.get('title')||''));
            if(sh){ history.replaceState(null,'',location.pathname); setTimeout(()=>window.onNative(JSON.stringify({type:'shared',url:sh})),250); }
          }
          </script>
          </body>
          </html>
          EOF_3
          echo "" | base64 -d > 'static/logo.png'
          cat > 'static/manifest.webmanifest' <<'EOF_4'
          {
           "name": "تحميل الفيديو",
           "short_name": "تحميل الفيديو",
           "description": "حمّل واحفظ محتواك المفضل",
           "lang": "ar",
           "dir": "rtl",
           "start_url": "/",
           "scope": "/",
           "display": "standalone",
           "background_color": "#0a0b14",
           "theme_color": "#0a0b14",
           "icons": [
            {
             "src": "icon-192.png",
             "sizes": "192x192",
             "type": "image/png",
             "purpose": "any maskable"
            },
            {
             "src": "icon-512.png",
             "sizes": "512x512",
             "type": "image/png",
             "purpose": "any maskable"
            }
           ],
           "share_target": {
            "action": "/",
            "method": "GET",
            "params": {
             "title": "title",
             "text": "text",
             "url": "url"
            }
           }
          }
          EOF_4
          ls -la . static

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -U flask waitress yt-dlp pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $bin = Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName src/ffmpeg.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") src/ffprobe.exe

      - name: Build EXE
        shell: bash
        working-directory: src
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name VideoDownloader --icon icon.ico \
            --add-data "static;static" --add-data "icon.ico;." \
            --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." \
            --hidden-import waitress --collect-submodules yt_dlp launcher.py

      - name: Self-test the EXE
        shell: pwsh
        working-directory: src
        run: |
          $p = Start-Process -FilePath "dist/VideoDownloader.exe" -ArgumentList "--selftest" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-v1.0.${{ github.run_number }}
          name: تحميل الفيديو لويندوز v1.0.${{ github.run_number }}
          body: |
            💻 حمّل ملف VideoDownloader.exe بالأسفل وانقر عليه مرتين — لا يحتاج أي تثبيت.
            إذا ظهرت رسالة Windows protected your PC اضغط More info ثم Run anyway.
          files: src/dist/VideoDownloader.exe
